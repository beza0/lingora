<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayarlar</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&amp;display=swap">
<style>
body{margin:0}
.app{--bg:#FAF8F5;--surface:#FFFFFF;--surface2:#F3F0F8;--text:#1E1B2E;--muted:#5E5A6E;--border:#E6E1EE;--primary:#5B3FD0;--primary-ink:#FFFFFF;--primary-soft:#EEE9FC;--primary-text:#4E33C2;--success:#1E7A46;--success-soft:#E5F4EA;--hint:#A34B07;--hint-soft:#FFF0E0;--danger:#B3263E;--danger-soft:#FCE8EC;--d-general:#0B7F80;--d-software:#2B63C9;--d-eng:#B45A0C;--d-yds:#6E42C8;
font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
.app.dark{--bg:#0E1424;--surface:#161E33;--surface2:#1D2740;--text:#ECEAF4;--muted:#A6A3BA;--border:#2A3452;--primary:#A58DFF;--primary-ink:#140F2E;--primary-soft:#2A2550;--primary-text:#BBA8FF;--success:#5BD08F;--success-soft:#173528;--hint:#F5A25A;--hint-soft:#3A2614;--danger:#FF8A9A;--danger-soft:#3D1A22;--d-general:#3CC7C4;--d-software:#6EA2FF;--d-eng:#F0A050;--d-yds:#B79BFF}
.app *{box-sizing:border-box}
.scroll{flex:1;overflow:hidden;padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;padding:16px 20px 8px;min-height:60px}
.h1{font-size:26px;line-height:32px;font-weight:700;margin:0;letter-spacing:-0.01em}
.h2{font-size:19px;line-height:26px;font-weight:650;margin:0}
.h3{font-size:16px;line-height:22px;font-weight:600;margin:0}
.body{font-size:15px;line-height:22px;margin:0}
.small{font-size:13px;line-height:18px;margin:0}
.label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.en{font-size:26px;line-height:34px;font-weight:650;margin:0;letter-spacing:-0.01em}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--text);text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn-p{background:var(--primary);color:var(--primary-ink)}
.btn-s{background:var(--surface);color:var(--primary-text);border-color:var(--border)}
.btn-g{background:transparent;color:var(--primary-text)}
.btn-dis{background:var(--surface2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;font-family:inherit}
.chip-p{background:var(--primary-soft);color:var(--primary-text);border-color:transparent}
.chip-warn{background:var(--hint-soft);color:var(--hint);border-color:transparent}
.chip-ok{background:var(--success-soft);color:var(--success);border-color:transparent}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow:hidden}
.tab{display:flex;align-items:center;gap:7px;padding:10px 10px 12px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);font-weight:650;border-bottom-color:var(--primary)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--border);background:var(--surface);padding:8px 4px 24px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;font-size:11.5px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a.on{color:var(--primary-text);font-weight:700}
.pill{width:54px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav a.on .pill{background:var(--primary-soft)}
.ico{flex:none;display:block}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:16px;font-weight:500;color:var(--text);font-family:inherit;text-align:left;width:100%}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.ok{border-color:var(--success);background:var(--success-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.key{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);flex:none;background:var(--surface)}
.hint{background:var(--hint-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;color:var(--text);font-size:14px;line-height:20px}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.sheet{background:var(--surface);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--border);padding:12px 20px 28px;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--border);align-self:center}
.input{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--muted);font-size:15px;font-family:inherit;width:100%}
.divider{height:1px;background:var(--border);flex:none}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);min-height:52px}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:19px;align-items:flex-start}
.skel{background:var(--surface2);border-radius:10px}
.icbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;flex:none;font-family:inherit;padding:0}
.icbtn.plain{border-color:transparent;background:transparent}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:500;background:none;border:none;font-family:inherit;min-width:60px;min-height:48px;padding:4px;text-decoration:none}
.ai{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:94%;font-size:15px;line-height:22px}
.me{background:var(--primary);color:var(--primary-ink);border-radius:16px 16px 4px 16px;padding:12px 14px;max-width:85%;align-self:flex-end;font-size:15px;line-height:22px}
.phrase{background:var(--primary-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.slot{background:var(--hint-soft);border-bottom:2px dashed var(--hint);padding:0 4px;border-radius:4px}
.tag{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button,.seg a{flex:1;min-height:38px;border:none;border-radius:9px;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.seg .on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(20,15,46,.08)}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);position:relative;flex:none}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on i{left:21px}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.check.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
a{color:var(--primary-text)}
</style>
</helmet>

      - "to call | “didn't” sonrası yalın fiil gelir."

grammar:
  - id: b2-third-conditional-wish
    title: "3. tip if ve wish / if only"
    short: "Geçmişte olmamış bir şeyi hayal ederken If + had + V3, would have + V3 kullanılır. Keşke cümleleri: şimdi için wish + past, geçmiş için wish + had + V3."
    long: "3. tip: If I had known, I would have helped. (Bilseydim yardım ederdim — ama bilmiyordum.) Olumsuz: If she hadn't missed the bus, she wouldn't have been late. Kısaltmalar: I'd known = I had known; I'd have = I would have. wish: Şimdiki durumdan şikâyet — I wish I had more time / I wish I could drive. Geçmiş pişmanlık — I wish I had studied medicine. If only aynı anlamda ama daha güçlü: If only I'd listened! Başkasının davranışından şikâyet: I wish you would stop shouting. Dikkat: if tarafında would kullanılmaz: If I would have known yanlış."
    ex: ["If we had booked earlier, we would have got a cheaper flight. | Daha erken ayırtsaydık daha ucuz uçuş bulurduk.", "I wish I had taken that job. | Keşke o işi kabul etseydim.", "If only it would stop raining! | Keşke yağmur dursa!"]
  - id: b2-past-modals
    title: "Geçmiş modallar: should have, must have, might have, can't have"
    short: "Modal + have + V3 geçmişle ilgili eleştiri (should have), güçlü tahmin (must have), olasılık (might / could have) ve imkânsızlık (can't have) bildirir."
    long: "should have + V3: yapılması gerekirdi ama yapılmadı — We should have left earlier. shouldn't have: yapılmamalıydı — I shouldn't have said that. must have + V3: kanıta dayalı güçlü tahmin — She must have been tired. might / may / could have + V3: olasılık — They might have got lost. can't / couldn't have + V3: olamaz — He can't have finished already! Dikkat: “must not have” olumsuz tahmin için genelde kullanılmaz; “can't have” tercih edilir. Modal sonrası have yalındır: should had yanlış."
    ex: ["You shouldn't have paid so much. | Bu kadar çok ödememeliydin.", "The lights are off. They must have gone out. | Işıklar kapalı. Dışarı çıkmış olmalılar.", "She can't have forgotten — I reminded her twice. | Unutmuş olamaz — ona iki kez hatırlattım."]

scenarios:
  - id: missed-flight
    title: "Kaçırılan uçak"
    sit: "Arkadaşınla havalimanına geç kaldınız ve uçağı kaçırdınız."
    d: 3
    targets: [should-have, if-only, blame, otherwise]
    turns:
      - ["Ali", "I can't believe we missed it! The gate closed five minutes ago.", "İnanamıyorum, kaçırdık! Kapı beş dakika önce kapandı."]
      - choose:
          - ["I know. We should have left home an hour earlier.", true, "Geçmiş eleştiri için “should have + V3”."]
          - ["I know. We should left home earlier.", false, "“should have left” olmalı."]
          - ["I know. We must have left earlier.", false, "“must have” tahmin bildirir; pişmanlık değil."]
      - ["Ali", "If we hadn't stopped for coffee, we would have made it.", "Kahve için durmasaydık yetişirdik."]
      - choose:
          - ["Maybe, but don't blame yourself. The traffic was terrible too.", true, "Teselli ve “blame yourself” doğru."]
          - ["If we wouldn't stop, we made it.", false, "3. tip yapısı bozuk."]
          - ["Yes, it's your fault totally.", false, "Kaba ve doğal değil."]
      - ["Ali", "You're right. Let's ask about the next flight.", "Haklısın. Bir sonraki uçuşu soralım."]
  - id: missing-colleague
    title: "Toplantıya gelmeyen iş arkadaşı"
    sit: "Önemli bir toplantıya iş arkadaşın Kerem gelmedi. Ekip olarak nedenini tahmin ediyorsunuz."
    d: 4
    targets: [might-have, probably-must-have, cant-have, turn-out]
    turns:
      - ["Lena", "Where's Kerem? He's never late.", "Kerem nerede? Asla geç kalmaz."]
      - choose:
          - ["He might have got stuck in traffic. There was an accident on the bridge.", true, "Olasılık için “might have + V3”."]
          - ["He might get stuck in traffic yesterday.", false, "Geçmiş tahmin için “might have got”."]
          - ["He must got stuck.", false, "“must have got” olmalı."]
      - ["Lena", "But he takes the metro.", "Ama metroyla geliyor."]
      - choose:
          - ["True. Then he can't have been in traffic. He must have forgotten the meeting.", true, "“can't have” ve “must have” doğru tahminler."]
          - ["True. Then he mustn't have been in traffic.", false, "Olumsuz tahminde “can't have” tercih edilir."]
          - ["True. Then he can't be in traffic yesterday.", false, "Geçmiş için “can't have been”."]
      - ["Lena", "Here's a message from him… It turns out his son is ill.", "Ondan bir mesaj geldi… Anlaşılan oğlu hastaymış."]

readings:
  - id: career-regret
    title: "The road not taken"
    kind: "Kişisel yazı"
    d: 4
    s:
      - ["When I was eighteen, I was offered a place at a music school in Vienna.", "On sekiz yaşımdayken Viyana'daki bir müzik okulunda yer teklif edildi."]
      - ["My parents thought it was too risky, so I studied economics instead.", "Ailem bunun çok riskli olduğunu düşündü, ben de onun yerine ekonomi okudum."]
      - ["If I had gone to Vienna, I might have become a professional pianist.", "Viyana'ya gitseydim profesyonel bir piyanist olabilirdim."]
      - ["In hindsight, though, I don't regret my choice: I met my wife at university.", "Yine de geriye dönüp bakınca seçimimden pişman değilim: Eşimle üniversitede tanıştım."]
      - ["I still wish I played more often, so I've started taking lessons again.", "Hâlâ keşke daha sık çalabilsem diyorum, bu yüzden yeniden ders almaya başladım."]
    gloss: ["was offered | teklif edildi", "instead | onun yerine", "in hindsight | geriye dönüp bakınca"]
    q:
      - q: "Yazar neden Viyana'ya gitmedi?"
        o: ["Parası yetmediği için", "Ailesi çok riskli bulduğu için", "Okula kabul edilmediği için"]
        a: 1
        why: "“My parents thought it was too risky”"
      - q: "Yazar seçiminden pişman mı?"
        o: ["Evet, çok pişman", "Hayır, çünkü eşiyle üniversitede tanıştı", "Metinde söylenmiyor"]
        a: 1
        why: "“I don't regret my choice: I met my wife at university.”"
  - id: mystery-note
    title: "The empty office"
    kind: "Kısa hikâye"
    d: 4
    s:
      - ["When Naz arrived at the office, the door was open but nobody was there.", "Naz ofise vardığında kapı açıktı ama kimse yoktu."]
      - ["The coffee on the desk was still warm, so someone must have left only minutes earlier.", "Masadaki kahve hâlâ sıcaktı, yani biri sadece birkaç dakika önce çıkmış olmalıydı."]
      - ["It can't have been the cleaner, because she only comes in the evening.", "Temizlikçi olamazdı, çünkü o sadece akşamları geliyor."]
      - ["Naz thought her boss might have gone to the meeting room.", "Naz, patronunun toplantı odasına gitmiş olabileceğini düşündü."]
      - ["It turned out that everyone was hiding there with a birthday cake for her.", "Herkesin orada, onun için bir doğum günü pastasıyla saklandığı ortaya çıktı."]
    gloss: ["still warm | hâlâ sıcak", "cleaner | temizlikçi", "hide | saklanmak"]
    q:
      - q: "Naz neden birinin az önce çıktığını düşündü?"
        o: ["Kapı açıktı", "Kahve hâlâ sıcaktı", "Bir not vardı"]

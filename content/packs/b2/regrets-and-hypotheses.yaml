id: b2-regrets-and-hypotheses
domain: b2
title: "Pişmanlıklar ve olasılıklar"
desc: "3. tip if, wish / if only, should have / must have / might have; geçmiş hakkında tahmin ve pişmanlık."
sort: 2

targets:

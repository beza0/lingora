    w: regret
    pos: v
    tr: "pişman olmak"
    ex: "I [[regret]] not studying harder at school."
    extr: "Okulda daha çok çalışmadığım için pişmanım."
    d: 3
    col: ["regret doing something", "deeply regret"]
    tone: ["Duygu"]
    dis:
      - "regrets | “I” ile fiile -s gelmez."
      - "remind | Hatırlatmak demektir."
      - "regard | Saymak, görmek demektir."
  - id: if-only
    w: if only
    pos: phrase
    tr: "keşke"
    ex: "[[If only]] I had listened to you!"
    extr: "Keşke seni dinleseydim!"
    d: 3
    syn: ["I wish"]
    tone: ["Duygu"]
    dis:
      - "Only if | “Sadece … ise” demektir."
      - "If ever | “Eğer hiç” demektir."
      - "Even if | “-se bile” demektir."
  - id: wish
    w: wish
    pos: v
    tr: "keşke … olsa, dilemek"
    ex: "I [[wish]] I lived closer to the sea."
    extr: "Keşke denize daha yakın yaşasam."
    d: 3
    conf: ["hope | Gerçekleşebilecek şey için: I hope you win."]
    tone: ["Duygu"]
    dis:
      - "hope | Gerçek dışı istekte “wish” kullanılır."
      - "want | “I want I lived” yanlış yapı."
      - "wishes | “I” ile fiile -s gelmez."
  - id: mistake
    w: mistake
    pos: n
    tr: "hata"
    ex: "Leaving that job was a big [[mistake]]."
    extr: "O işten ayrılmak büyük bir hataydı."
    d: 3
    col: ["make a mistake", "by mistake"]
    tone: ["Değerlendirme"]
    dis:
      - "mistaken | Sıfat (yanılmış); isim gerekir."
      - "mistrust | Güvensizlik demektir."
      - "misuse | Kötüye kullanma demektir."
  - id: blame
    w: blame
    pos: v
    tr: "suçlamak"
    ex: "Don't [[blame]] yourself — it wasn't your fault."
    extr: "Kendini suçlama — senin hatan değildi."
    d: 3
    col: ["blame someone for something", "be to blame"]
    tone: ["Duygu"]
    dis:
      - "flame | Alev demektir."
      - "blank | Boş demektir."
      - "blames | “Don't” sonrası yalın fiil gelir."
  - id: fault
    w: fault
    pos: n
    tr: "kusur, hata (sorumluluk)"
    ex: "The accident wasn't the driver's [[fault]]."
    extr: "Kaza sürücünün hatası değildi."
    d: 3
    conf: ["mistake | Yanlışlık; fault = sorumluluk/kusur."]
    tone: ["Değerlendirme"]
    dis:
      - "fold | Katlamak demektir."
      - "vault | Kasa, tonoz demektir."
      - "fall | Düşmek demektir."
  - id: luckily
    w: luckily
    pos: adv
    tr: "neyse ki, şans eseri"

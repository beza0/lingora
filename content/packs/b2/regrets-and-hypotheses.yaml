    t: "If I had …, I would have …"
    ex: "If I had left earlier, I would have [[caught]] the train."
    extr: "Daha erken çıksaydım trene yetişirdim."
    ttr: "Daha erken çıksaydım …"
    slots: ["caught the train | trene yetişirdim", "found a seat | yer bulurdum", "avoided the traffic | trafiğe girmezdim"]
    chunks: ["If I had left | çıksaydım", "I would have caught | yetişirdim"]
    g: b2-third-conditional-wish
    ctx: ["Pişmanlık"]
    tone: ["Koşul"]
    d: 3
    dis:
      - "catch | “would have” sonrası üçüncü hâl gerekir."
      - "catched | “catch” düzensizdir: caught."
      - "caughted | Böyle bir biçim yok."
  - id: if-hadnt
    t: "If you hadn't …, we wouldn't have …"
    ex: "If you [[hadn't]] helped me, I wouldn't have finished on time."
    extr: "Bana yardım etmeseydin zamanında bitiremezdim."
    ttr: "Bana yardım etmeseydin …"
    slots: ["I wouldn't have finished on time | zamanında bitiremezdim", "I'd have failed | kalırdım", "I'd have given up | pes ederdim"]
    chunks: ["If you hadn't helped | yardım etmeseydin", "I wouldn't have finished | bitiremezdim"]
    g: b2-third-conditional-wish
    ctx: ["Teşekkür"]
    tone: ["Koşul"]
    d: 3
    dis:

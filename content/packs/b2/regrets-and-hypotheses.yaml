      - q: "Temizlikçi neden şüpheli değildi?"
        o: ["Sadece akşamları geliyor", "O gün izinliydi", "Toplantı odasındaydı"]
        a: 0
        why: "“she only comes in the evening”"

writing:
  id: b2-regret-story
  p: "Hayatında farklı karar verseydin ne olurdu? 6–8 cümlelik bir paragraf yaz; 3. tip if, wish ve en az bir geçmiş modal kullan."
  rubric: ["3. tip if doğru (If I had …, I would have …)", "wish / if only ile pişmanlık ya da istek", "should have / might have / must have doğru kullanılmış", "Olaylar mantıklı bir sırayla anlatılmış"]
  samples: ["Three years ago I had to choose between a job in Ankara and a master's degree in Germany. I chose the job because I didn't want to leave my family. If I had gone to Germany, I would have learned German and I might have found a job there. Sometimes I wish I had been braver. On the other hand, I've learned a lot at work, and I've been promoted twice. My manager says I must have been the fastest learner in the team. In hindsight, I shouldn't have worried so much — both options were good."]
  d: 4

situations:
  - { parent: "Pişmanlık", name: "Keşkeler ve pişmanlıklar", items: [regret, if-only, wish, mistake, should-have, miss-a-chance, in-hindsight, if-had-would-have, i-wish-i-had, i-wish-could, you-should-have, wouldnt-have-if] }
  - { parent: "Tahmin", name: "Geçmiş hakkında tahmin", items: [probably-must-have, cant-have, might-have, turn-out, realise, must-have-been, might-have-left, it-turned-out] }
  - { parent: "Anlatı", name: "Sorumluluk ve özür", items: [blame, fault, apologise, luckily, otherwise, consequence, by-chance, take-for-granted, if-hadnt, im-sorry-i-didnt] }

id: a2-past-weekend
domain: a2
title: "Geçen hafta sonu ve anılar"
desc: "Past simple (düzenli / düzensiz fiiller), was / were; geçmişte olanları anlatma."
sort: 1

targets:
  - id: yesterday
    w: yesterday
    pos: adv
    tr: "dün"
    ex: "I called my grandmother [[yesterday]]."
    extr: "Dün babaanneme telefon ettim."
    d: 1
    col: ["yesterday morning", "the day before yesterday"]
    tone: ["Zaman"]
    dis:
      - "tomorrow | Yarın demektir; fiil geçmiş zamanda."
      - "next week | Gelecek hafta demektir; “called” geçmiş zaman."
      - "yesterdays | Zarf çoğul yapılmaz."
  - id: last-weekend
    w: last weekend
    pos: phrase
    tr: "geçen hafta sonu"
    ex: "What did you do [[last weekend]]?"
    extr: "Geçen hafta sonu ne yaptın?"
    d: 1
    col: ["last night", "last summer", "last year"]
    tone: ["Zaman"]
    dis:
      - "the last weekend | “Geçen” anlamında tanımlık kullanılmaz."
      - "next weekend | Gelecek hafta sonu demektir; “did” ile uyuşmaz."
      - "in last weekend | “last” ile edat kullanılmaz."
  - id: ago
    w: ago
    pos: adv
    tr: "önce (zaman)"
    ex: "We moved here two years [[ago]]."
    extr: "Buraya iki yıl önce taşındık."
    d: 2
    conf: ["before | “before” tek başına “daha önce”; süre + önce = “ago”."]
    tone: ["Zaman"]
    dis:
      - "behind | “Arkasında” demektir."
      - "after | “Sonra” demektir."
      - "since | “-den beri” demektir; geçmiş zamanla bu yapıda kullanılmaz."
  - id: went
    w: went
    pos: v
    tr: "gitti (go fiilinin geçmişi)"
    ex: "We [[went]] to the beach on Saturday."
    extr: "Cumartesi plaja gittik."
    d: 1
    fam: ["go – went – gone"]
    tone: ["Geçmiş"]
    dis:
      - "goed | “go” düzensizdir; geçmişi “went”."
      - "gone | Üçüncü hâl; yardımcı fiil olmadan kullanılmaz."
      - "go | Geçmiş zaman gerekir."
  - id: saw
    w: saw
    pos: v
    tr: "gördü (see fiilinin geçmişi)"
    ex: "I [[saw]] a great film last night."
    extr: "Dün gece harika bir film izledim."
    d: 1
    fam: ["see – saw – seen"]
    tone: ["Geçmiş"]
    dis:
      - "seed | Tohum demektir."
      - "seen | Üçüncü hâl; tek başına geçmiş anlatmaz."
      - "sawed | “saw” (testere) fiilinin geçmişi; görmek değil."
  - id: bought
    w: bought
    pos: v
    tr: "satın aldı (buy fiilinin geçmişi)"
    ex: "She [[bought]] a new jacket at the market."
    extr: "Pazardan yeni bir ceket aldı."
    d: 2

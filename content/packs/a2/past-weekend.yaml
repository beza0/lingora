grammar:
  - id: a2-past-simple
    title: "Past simple: geçmişte bitmiş olaylar"
    short: "Geçmişte bitmiş bir olay için fiile -ed eklenir (worked) veya düzensiz biçim kullanılır (went). Soru ve olumsuzda did / didn't + yalın fiil."
    long: "Düzenli: work → worked, stay → stayed, study → studied, stop → stopped. Düzensiz fiiller ezberlenir: go → went, see → saw, buy → bought, have → had, take → took, make → made, eat → ate, lose → lost. Olumsuz: didn't + yalın fiil — I didn't see him. Soru: Did + özne + yalın fiil — Did you go out? Kısa cevap: Yes, I did. / No, I didn't. Zaman ifadeleri: yesterday, last week, two days ago, in 2020. Dikkat: did / didn't varken fiil geçmişe çevrilmez — Did you went? yanlış."
    ex: ["We visited Mardin last summer. | Geçen yaz Mardin'i gezdik.", "I didn't buy anything. | Hiçbir şey almadım.", "Did she call you? — No, she didn't. | Seni aradı mı? — Hayır, aramadı."]
  - id: a2-was-were
    title: "was / were: am-is-are'nin geçmişi"
    short: "Geçmişte bir durumu anlatırken I / he / she / it ile was, you / we / they ile were kullanılır."
    long: "Olumlu: I was tired. They were at home. Olumsuz: wasn't / weren't — The hotel wasn't expensive. Soru: Was it good? Were you there? Kısa cevap: Yes, it was. / No, they weren't. Var/yok: There was a problem. / There were many people. Dikkat: sıfat ve yer anlatırken was/were kullanılır, did değil — “How did the film?” yanlış; doğrusu “How was the film?”"
    ex: ["The weather was perfect. | Hava mükemmeldi.", "We weren't at home on Sunday. | Pazar günü evde değildik.", "Was the museum open? — Yes, it was. | Müze açık mıydı? — Evet, açıktı."]

scenarios:
  - id: monday-chat
    title: "Pazartesi sabahı sohbet"
    sit: "İş arkadaşın hafta sonunu nasıl geçirdiğini soruyor."
    d: 1
    targets: [last-weekend, went, had-a-great-time, crowded]
    turns:
      - ["Anna", "Morning! How was your weekend?", "Günaydın! Hafta sonun nasıldı?"]
      - choose:
          - ["It was great, thanks. I went to Bursa with my family.", true, "“was” ve “went” doğru kullanılmış."]
          - ["It is great. I go to Bursa.", false, "Geçmiş anlatılıyor; geçmiş zaman gerekir."]
          - ["It were great.", false, "“It” ile “was” kullanılır."]
      - ["Anna", "Nice! What did you do there?", "Güzel! Orada ne yaptınız?"]
      - choose:
          - ["We visited the old bazaar and ate İskender. We had a great time.", true, "Past simple ile doğru sıralanmış."]
          - ["We visit the old bazaar and eat İskender.", false, "Fiiller geçmiş zamanda olmalı."]
          - ["We did visited the old bazaar.", false, "“did” ile fiil yalın olur; olumlu cümlede “did” gerekmez."]
      - ["Anna", "Was it crowded?", "Kalabalık mıydı?"]
      - choose:
          - ["Yes, it was. There were lots of tourists.", true, "Kısa cevap ve “there were” doğru."]
          - ["Yes, it did.", false, "“Was it …?” sorusuna “it was” ile cevap verilir."]
          - ["Yes, there was lots of tourists.", false, "Çoğul isimle “there were”."]
  - id: lost-bag
    title: "Kayıp çanta"
    sit: "Otobüste çantanı unuttun ve kayıp eşya bürosuna gittin."
    d: 2
    targets: [lose, forget, yesterday, on-the-way]
    turns:
      - ["Officer", "Good morning. How can I help?", "Günaydın. Nasıl yardımcı olabilirim?"]
      - choose:
          - ["I lost my bag yesterday. I forgot it on the number 12 bus.", true, "Geçmiş zamanla net açıklama."]
          - ["I lose my bag yesterday.", false, "“yesterday” geçmiş zaman ister: lost."]
          - ["I losted my bag.", false, "“lose” düzensizdir: lost."]
      - ["Officer", "What time did you get off the bus?", "Otobüsten saat kaçta indiniz?"]
      - choose:
          - ["At about half past five, on the way home from work.", true, "Saat ve bağlam verilmiş."]
          - ["I get off at half past five.", false, "Soru geçmişte; cevap geçmişte olmalı."]
          - ["I did got off at five.", false, "“did” sonrası fiil yalın olur."]
      - ["Officer", "Let me check… Is it a black backpack?", "Bir bakayım… Siyah bir sırt çantası mı?"]

readings:
  - id: postcard-cappadocia
    title: "A postcard from Cappadocia"
    kind: "Kartpostal"
    d: 2
    s:
      - ["Hi Ece! We arrived in Cappadocia on Friday evening.", "Selam Ece! Kapadokya'ya cuma akşamı vardık."]
      - ["On Saturday we got up at four and took a balloon tour.", "Cumartesi saat dörtte kalktık ve balon turuna katıldık."]
      - ["It was cold, but the view was amazing!", "Soğuktu ama manzara muhteşemdi!"]
      - ["We didn't visit the underground city because it was too crowded.", "Yeraltı şehrini gezmedik çünkü çok kalabalıktı."]
      - ["We're going back home tomorrow. See you soon! — Burak", "Yarın eve dönüyoruz. Görüşmek üzere! — Burak"]
    gloss: ["balloon tour | balon turu", "view | manzara", "underground city | yeraltı şehri"]
    q:
      - q: "Burak cumartesi sabahı ne yaptı?"
        o: ["Yeraltı şehrini gezdi", "Balon turuna katıldı", "Eve döndü"]
        a: 1
        why: "“On Saturday we got up at four and took a balloon tour.”"
      - q: "Neden yeraltı şehrine gitmediler?"

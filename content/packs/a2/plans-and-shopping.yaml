      - "many | Fiyat için “How much”."
      - "do | “How much do these” eksik kalır."
  - id: not-as-as
    t: "… isn't as … as …"
    ex: "My new flat isn't [[as]] big as my old one."
    extr: "Yeni dairem eskisi kadar büyük değil."
    ttr: "Yeni dairem eskisi kadar … değil."
    slots: ["big | büyük", "bright | aydınlık", "noisy | gürültülü"]
    chunks: ["isn't as big | o kadar büyük değil", "as my old one | eskisi kadar"]

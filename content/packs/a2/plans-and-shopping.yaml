patterns:
  - id: im-going-to
    t: "I'm going to … next …"
    ex: "I'm going to [[learn]] to drive next year."
    extr: "Seneye araba kullanmayı öğreneceğim."
    ttr: "Seneye … öğreneceğim."
    slots: ["to drive | araba kullanmayı", "to swim | yüzmeyi", "Spanish | İspanyolca"]
    chunks: ["I'm going to | -eceğim (niyet)", "learn | öğrenmek", "next year | seneye"]
    g: a2-future-plans
    ctx: ["Plan"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "learning | “going to” sonrası yalın fiil gelir."
      - "learned | “going to” sonrası yalın fiil gelir."
      - "learns | “going to” sonrası yalın fiil gelir."
  - id: are-you-going-to
    t: "Are you going to … ?"
    ex: "Are you going [[to]] watch the match tonight?"
    extr: "Bu akşam maçı izleyecek misin?"
    ttr: "Bu akşam … izleyecek misin?"
    slots: ["the match | maçı", "the new series | yeni diziyi", "the final | finali"]
    chunks: ["Are you going to | -ecek misin", "watch | izlemek", "tonight | bu akşam"]
    g: a2-future-plans
    ctx: ["Plan"]
    tone: ["Soru"]
    d: 1
    dis:
      - "for | “going to” kalıbı “to” ile kurulur."
      - "at | Kalıp “going to + fiil”."
      - "will | “going will” diye bir yapı yok."
  - id: im-meeting-on
    t: "I'm … on …"
    ex: "I'm [[meeting]] my friends on Friday."
    extr: "Cuma günü arkadaşlarımla buluşuyorum."
    ttr: "Cuma günü …"
    slots: ["meeting my friends | arkadaşlarımla buluşuyorum", "flying to İzmir | İzmir'e uçuyorum", "seeing the dentist | dişçiye gidiyorum"]
    chunks: ["I'm meeting | buluşuyorum (ayarlanmış plan)", "on Friday | cuma günü"]
    g: a2-future-plans
    ctx: ["Plan"]
    tone: ["Günlük"]
    d: 2
    dis:
      - "meet | “I'm” sonrası -ing gerekir."
      - "met | Geçmiş zaman; plan anlatılıyor."
      - "to meet | “I'm to meet” resmî ve farklı anlamdadır."
  - id: is-than
    t: "… is …-er than …"
    ex: "The train is [[faster]] than the bus."
    extr: "Tren otobüsten daha hızlı."
    ttr: "Tren otobüsten daha …"
    slots: ["faster | hızlı", "cheaper | ucuz", "quieter | sessiz"]
    chunks: ["The train is | tren", "faster than | -den daha hızlı", "the bus | otobüs"]
    g: a2-comparatives
    ctx: ["Karşılaştırma"]
    tone: ["Tanımlama"]
    d: 1
    dis:
      - "more fast | Kısa sıfatlara -er eklenir."
      - "fastest | En hızlı demektir; “than” ile kullanılmaz."
      - "fast | “than” ile karşılaştırma biçimi gerekir."
  - id: more-than
    t: "… is more … than …"
    ex: "Living in İstanbul is more [[expensive]] than living in Sivas."
    extr: "İstanbul'da yaşamak Sivas'ta yaşamaktan daha pahalı."
    ttr: "İstanbul'da yaşamak Sivas'ta yaşamaktan daha …"

writing:
  id: a2-plans-message
  p: "Bir arkadaşına önümüzdeki ay için planlarını anlatan 5–6 cümlelik bir mesaj yaz. En az bir karşılaştırma cümlesi kullan."
  rubric: ["going to veya present continuous ile plan anlatılmış", "En az bir karşılaştırma var (-er / more / as … as)", "Mesaj selamlama ve kapanışla bitmiş"]
  samples: ["Hi Arda! Next month is going to be busy. I'm starting a new job on the 3rd, and I'm going to move to a smaller flat. It's further from the centre, but it's cheaper than my old one. On the 20th I'm visiting my parents in Edirne. Are you free at the end of the month? Let's meet! — Deniz"]
  d: 2

situations:
  - { parent: "Plan", name: "Plan yapma ve davet", items: [tomorrow, next-month, plan, book-a-table, invite, free-time, im-going-to, are-you-going-to, im-meeting-on] }
  - { parent: "Plan", name: "Tahmin ve umut", items: [probably, hopefully, save-money, will-probably] }
  - { parent: "Alışveriş", name: "Mağazada", items: [cheap, expensive, try-on, size, receipt, discount, pay-by-card, can-i-try, how-much-is-are] }
  - { parent: "Karşılaştırma", name: "Ürünleri ve yerleri karşılaştırma", items: [better, the-best, worse, comfortable, is-than, more-than, the-most, not-as-as] }

    ctx: ["Karşılaştırma"]
    tone: ["Olumsuz"]
    d: 2
    dis:
      - "like | “as … as” kalıbında “like” kullanılmaz."
      - "more | “as … as” kalıbı bozulur."
      - "than | Kalıp “as … as”."
  - id: will-probably
    t: "I think it will …"
    ex: "I think it [[will]] be sunny tomorrow."
    extr: "Bence yarın hava güneşli olacak."
    ttr: "Bence yarın hava … olacak."
    slots: ["sunny | güneşli", "cold | soğuk", "windy | rüzgârlı"]
    chunks: ["I think | bence", "it will be | olacak", "tomorrow | yarın"]
    g: a2-future-plans
    ctx: ["Tahmin"]
    tone: ["Görüş"]
    d: 2
    dis:
      - "is going | “is going be” eksik; “to” gerekir."
      - "will to | “will” sonrası “to” gelmez."
      - "was | Geçmiş zaman; yarın anlatılıyor."

grammar:
  - id: a2-future-plans
    title: "Gelecek: going to, present continuous ve will"
    short: "Niyet ve planlar için going to, saati/yeri belli ayarlanmış planlar için present continuous, anlık karar ve tahmin için will kullanılır."
    long: "going to + yalın fiil: önceden verilmiş karar — I'm going to start a course. Present continuous: ayarlanmış plan — I'm flying to Van on Monday (bilet alındı). will + yalın fiil: tahmin veya o an verilen karar — I think it will rain. / I'll help you. Olumsuz: I'm not going to … / I won't … Soru: Are you going to …? / Will you …? Zaman ifadeleri: tomorrow, next week, this weekend, in two days. Dikkat: “going to” sonrası fiil yalın kalır: going to visit (going to visiting değil)."
    ex: ["I'm going to cook pasta tonight. | Bu akşam makarna yapacağım.", "We're having a party on Saturday. | Cumartesi parti veriyoruz.", "It's cold. I'll close the window. | Hava soğuk. Pencereyi kapatayım."]
  - id: a2-comparatives
    title: "Karşılaştırma: -er / more, the -est / the most, as … as"
    short: "İki şeyi karşılaştırırken kısa sıfatlara -er (cheaper), uzunlara more (more expensive) eklenir ve than kullanılır. “En” için the -est / the most."
    long: "Kısa sıfat: cheap → cheaper → the cheapest; big → bigger → the biggest; easy → easier → the easiest. Uzun sıfat: comfortable → more comfortable → the most comfortable. Düzensiz: good → better → the best; bad → worse → the worst; far → further → the furthest. Eşitlik: as big as (kadar büyük); not as cheap as (kadar ucuz değil). Dikkat: “more cheaper” gibi iki karşılaştırma bir arada kullanılmaz."
    ex: ["My bag is heavier than yours. | Benim çantam seninkinden daha ağır.", "This is the most popular café in the area. | Burası bölgedeki en popüler kafe.", "The test wasn't as hard as I thought. | Sınav düşündüğüm kadar zor değildi."]

scenarios:
  - id: weekend-plans
    title: "Hafta sonu planı yapmak"
    sit: "Bir arkadaşın hafta sonu planlarını soruyor ve birlikte bir şey yapmayı teklif ediyor."
    d: 2
    targets: [plan, book-a-table, invite, probably]
    turns:
      - ["Ece", "Do you have any plans for Saturday?", "Cumartesi için bir planın var mı?"]
      - choose:
          - ["Yes, I'm meeting my cousin in the morning, but I'm free in the evening.", true, "Ayarlanmış plan için present continuous doğru."]
          - ["Yes, I meet my cousin tomorrow morning yesterday.", false, "Zaman ifadeleri çelişiyor."]
          - ["Yes, I'm going meet my cousin.", false, "“going to” kalıbında “to” eksik."]
      - ["Ece", "Great! Shall we have dinner? I can book a table.", "Harika! Akşam yemeği yiyelim mi? Masa ayırtabilirim."]
      - choose:
          - ["Good idea. I'll probably be home by six, so let's say eight?", true, "Tahmin için “will probably” ve öneri."]
          - ["Good idea. I probably am home by six.", false, "Gelecek için “I'll probably be” gerekir."]
          - ["Good idea. I'm going to be probably home.", false, "“probably” yeri yanlış; doğal değil."]
      - ["Ece", "Perfect. I'm going to invite Mert too.", "Mükemmel. Mert'i de davet edeceğim."]
  - id: clothes-shop
    title: "Mağazada"
    sit: "Bir mağazada ceket bakıyorsun ve satış görevlisiyle konuşuyorsun."
    d: 1
    targets: [try-on, size, cheap, pay-by-card]
    turns:
      - ["Assistant", "Hi, can I help you?", "Merhaba, yardımcı olabilir miyim?"]
      - choose:
          - ["Yes, can I try this jacket on? Do you have it in a medium size?", true, "Kibar istek ve beden sorusu doğru."]
          - ["Yes, I want try this jacket.", false, "“want to try” olmalı ve giysi için “try on” kullanılır."]
          - ["Yes, can I test this jacket?", false, "Giysi için “try on” kullanılır."]
      - ["Assistant", "Sure, here you are. The changing room is over there.", "Tabii, buyurun. Deneme kabini şurada."]
      - choose:
          - ["Thanks. It's nice, but it's more expensive than the blue one. Is there a discount?", true, "Karşılaştırma ve indirim sorusu doğru."]
          - ["It's more expensiver than the blue one.", false, "“more” ve “-er” birlikte kullanılmaz."]
          - ["It's expensive than the blue one.", false, "Karşılaştırma için “more expensive” gerekir."]
      - ["Assistant", "Yes, there's 15% off today. Do you want to pay by card?", "Evet, bugün %15 indirim var. Kartla mı ödemek istersiniz?"]

readings:
  - id: summer-plans-message
    title: "Summer plans"
    kind: "Mesaj"
    d: 2
    s:
      - ["Hi Leyla! My exams finish next week, so I'm going to have a long holiday.", "Selam Leyla! Sınavlarım gelecek hafta bitiyor, yani uzun bir tatil yapacağım."]
      - ["I'm flying to Trabzon on the 5th of July to stay with my grandparents.", "Büyükannemle büyükbabamın yanında kalmak için 5 Temmuz'da Trabzon'a uçuyorum."]
      - ["In August I'm going to work in a café to save money.", "Ağustosta para biriktirmek için bir kafede çalışacağım."]
      - ["The job isn't as exciting as a holiday, but it will be useful.", "İş, tatil kadar heyecanlı değil ama faydalı olacak."]
      - ["What about you? Are you going to visit us?", "Peki ya sen? Bizi ziyaret edecek misin?"]
    gloss: ["grandparents | büyükanne ve büyükbaba", "save money | para biriktirmek", "useful | faydalı"]
    q:
      - q: "Yazan kişi ağustosta ne yapacak?"
        o: ["Trabzon'a gidecek", "Bir kafede çalışacak", "Sınavlara girecek"]
        a: 1
        why: "“In August I'm going to work in a café”"
      - q: "Trabzon yolculuğu neden present continuous ile anlatılmış?"

      - "trying | “Can” sonrası yalın fiil gelir."
      - "test | Giysi için “try on” kullanılır."
  - id: how-much-is-are
    t: "How much is/are …?"
    ex: "How much [[are]] these sunglasses?"
    extr: "Bu güneş gözlüğü ne kadar?"
    ttr: "… ne kadar?"
    slots: ["these sunglasses | Bu güneş gözlüğü", "these boots | Bu botlar", "the headphones | Kulaklıklar"]
    chunks: ["How much | ne kadar", "are these sunglasses | bu güneş gözlüğü"]
    g: a2-comparatives
    ctx: ["Alışveriş"]
    tone: ["Soru"]
    d: 1
    dis:

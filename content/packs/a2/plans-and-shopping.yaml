    w: tomorrow
    pos: adv
    tr: "yarın"
    ex: "I'm meeting Ali [[tomorrow]] at five."
    extr: "Yarın saat beşte Ali'yle buluşuyorum."
    d: 1
    col: ["tomorrow morning", "the day after tomorrow"]
    tone: ["Zaman"]
    dis:
      - "yesterday | Dün demektir; plan anlatılıyor."
      - "tomorrows | Zarf çoğul yapılmaz."
      - "to morning | Anlamsız bir ifadedir."
  - id: next-month
    w: next month
    pos: phrase
    tr: "gelecek ay"
    ex: "We're going to move house [[next month]]."
    extr: "Gelecek ay taşınacağız."
    d: 1
    col: ["next week", "next year", "next summer"]
    tone: ["Zaman"]
    dis:
      - "the next month | “Gelecek” anlamında tanımlık kullanılmaz."
      - "last month | Geçen ay demektir; “going to” ile uyuşmaz."
      - "in next month | “next” ile edat kullanılmaz."
  - id: plan
    w: plan
    pos: n
    tr: "plan"
    ex: "Do you have any [[plans]] for the summer?"
    extr: "Yaz için bir planın var mı?"
    d: 1
    col: ["make plans", "change your plans"]
    tone: ["Günlük"]
    dis:
      - "plants | Bitkiler demektir."
      - "planes | Uçaklar demektir."
      - "plays | Oyunlar demektir."
  - id: save-money
    w: save money
    pos: phrase
    tr: "para biriktirmek"
    ex: "I'm going to [[save money]] for a new laptop."
    extr: "Yeni bir dizüstü bilgisayar için para biriktireceğim."
    d: 2
    conf: ["spend money | Para harcamak."]
    tone: ["Para"]
    dis:
      - "keep money | Doğal değil; “save money” denir."
      - "save moneys | “money” sayılamaz; çoğul olmaz."
      - "safe money | “safe” güvenli (sıfat) demektir."
  - id: cheap
    w: cheap
    pos: adj
    tr: "ucuz"
    ex: "This T-shirt is very [[cheap]]: only 100 lira."
    extr: "Bu tişört çok ucuz: sadece 100 lira."
    d: 1
    ant: ["expensive"]
    tone: ["Alışveriş"]
    dis:
      - "chip | Cips, çip demektir."
      - "cheep | Cıvıldamak demektir."
      - "expensive | “only 100 lira” ile çelişir."
  - id: expensive
    w: expensive

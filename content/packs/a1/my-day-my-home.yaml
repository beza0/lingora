      - ["I'm Kaan and I work in a hotel.", "Ben Kaan, bir otelde çalışıyorum."]
      - ["I get up at half past five because my work starts at seven.", "Beş buçukta kalkıyorum çünkü işim yedide başlıyor."]
      - ["I don't have breakfast at home; I eat at the hotel.", "Kahvaltıyı evde yapmıyorum; otelde yiyorum."]
      - ["I finish work at three and I usually go to the gym.", "Saat üçte işi bitiriyorum ve genellikle spor salonuna gidiyorum."]
      - ["In the evening I cook dinner and go to bed early.", "Akşam yemek yapıyorum ve erken yatıyorum."]
    gloss: ["half past five | beş buçuk", "finish work | işi bitirmek", "go to bed | yatmak"]
    q:
      - q: "Kaan neden çok erken kalkıyor?"
        o: ["Spor yapmak için", "İşi yedide başladığı için", "Kahvaltı hazırlamak için"]
        a: 1
        why: "“because my work starts at seven”"
      - q: "Kaan işten sonra genellikle ne yapıyor?"
        o: ["Spor salonuna gidiyor", "Televizyon izliyor", "Otelde kalıyor"]
        a: 0
        why: "“I usually go to the gym.”"
  - id: flat-advert
    title: "Flat for rent"
    kind: "Kiralık ev ilanı"
    d: 1
    s:
      - ["Flat for rent in Kadıköy, near the sea.", "Kadıköy'de, denize yakın kiralık daire."]
      - ["There are two bedrooms, a living room and a small kitchen.", "İki yatak odası, bir oturma odası ve küçük bir mutfak var."]
      - ["There's a balcony, but there isn't a lift.", "Balkon var ama asansör yok."]
      - ["The bus stop is next to the building.", "Otobüs durağı binanın yanında."]
      - ["Pets are not allowed.", "Evcil hayvan kabul edilmiyor."]
    gloss: ["flat | daire", "lift | asansör", "pets | evcil hayvanlar"]
    q:

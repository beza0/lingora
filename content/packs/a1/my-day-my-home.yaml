grammar:
  - id: a1-present-simple
    title: "Present simple: alışkanlıklar ve rutinler"
    short: "Her gün, genellikle, asla gibi alışkanlıklar present simple ile anlatılır. He / she / it ile fiile -s eklenir: she works."
    long: "Olumlu: I/you/we/they work; he/she/it works (go → goes, watch → watches, study → studies, have → has). Olumsuz: don't / doesn't + yalın fiil — She doesn't work on Sundays. Soru: Do / Does + özne + yalın fiil — Does he like tea? Kısa cevap: Yes, he does. Sıklık zarfları (always, usually, often, sometimes, never) fiilden önce, “be” fiilinden sonra gelir: I usually walk. / I'm always late. Dikkat: “doesn't” ve “does” varken fiile -s eklenmez: Does she works? yanlış."
    ex: ["My brother gets up at six. | Ağabeyim altıda kalkar.", "We don't watch TV in the morning. | Sabahları televizyon izlemeyiz.", "Does your mother cook every day? — Yes, she does. | Annen her gün yemek yapar mı? — Evet."]
  - id: a1-there-is-are
    title: "there is / there are (var / yok)"
    short: "Bir yerde bir şeyin var olduğunu söylerken tekil için there is, çoğul için there are kullanılır."
    long: "Tekil ve sayılamayan: There's a bed. / There's some milk. Çoğul: There are two chairs. Olumsuz: There isn't a lift. / There aren't any shops. Soru: Is there a garden? — Yes, there is. / Are there any windows? — No, there aren't. Sayılamayan isimlerde (bread, water, milk) olumsuz ve soruda “any” kullanılır. Dikkat: Türkçedeki “var” için “have” kullanılmaz; “My house has a garden” da doğrudur ama “In my house have a garden” yanlıştır."
    ex: ["There's a small garden behind the house. | Evin arkasında küçük bir bahçe var.", "There aren't any chairs in the kitchen. | Mutfakta hiç sandalye yok.", "Is there a bank near here? — Yes, there is. | Buralarda banka var mı? — Evet, var."]

scenarios:
  - id: daily-routine-chat
    title: "Günlük rutin sohbeti"
    sit: "Yeni bir iş arkadaşı günlük rutinini soruyor."
    d: 1
    targets: [get-up, usually, go-to-work, early]
    turns:
      - ["Tom", "You're always here early! What time do you get up?", "Hep erkencisin! Saat kaçta kalkıyorsun?"]
      - choose:
          - ["I usually get up at six. I go to work by metro.", true, "Rutin present simple ile doğru anlatılıyor."]
          - ["I usually getting up at six.", false, "Yardımcı fiil olmadan -ing kullanılmaz."]
          - ["I get usually up at six.", false, "Sıklık zarfı fiilden önce gelir."]
      - ["Tom", "Wow. Do you have breakfast at home?", "Vay. Kahvaltıyı evde mi yapıyorsun?"]
      - choose:
          - ["No, I don't. I have breakfast at the office.", true, "Kısa cevap ve açıklama doğru."]
          - ["No, I doesn't.", false, "“I” ile “don't” kullanılır."]
          - ["No, I not have.", false, "Olumsuz için “don't have” gerekir."]
      - ["Tom", "Good idea. The café downstairs is great.", "İyi fikir. Alt kattaki kafe harika."]
  - id: flat-viewing
    title: "Ev görmeye gitmek"
    sit: "Kiralık bir daireye bakıyorsun ve ev sahibine sorular soruyorsun."
    d: 1
    targets: [bedroom, kitchen, near, rent]
    turns:
      - ["Owner", "Come in! This is the living room.", "Buyurun! Burası oturma odası."]
      - choose:
          - ["It's nice. How many bedrooms are there?", true, "Çoğul isimle “are there” doğru."]
          - ["It's nice. How many bedroom is there?", false, "“How many” çoğul isim ve “are” ister."]
          - ["It's nice. How much bedrooms have?", false, "Sayılabilen isim için “How many” kullanılır."]
      - ["Owner", "There are two bedrooms and a big kitchen.", "İki yatak odası ve büyük bir mutfak var."]
      - choose:
          - ["Great. Is there a bus stop near here?", true, "“Is there …?” doğru soru."]
          - ["Great. Is it a bus stop near here?", false, "Var olup olmadığı “Is there” ile sorulur."]
          - ["Great. Has a bus stop near here?", false, "Özne ve doğru yapı eksik."]
      - ["Owner", "Yes, there's one next to the supermarket.", "Evet, süpermarketin yanında bir tane var."]

readings:
  - id: a-day-in-my-life

    w: name
    pos: n
    tr: "isim, ad"
    ex: "My [[name]] is Zeynep."
    extr: "Benim adım Zeynep."
    d: 1
    col: ["first name", "last name", "What's your name?"]
    tone: ["Günlük", "Tanışma"]
    dis:
      - "nose | Burun demektir."
      - "number | Numara demektir."
      - "game | Oyun demektir."
  - id: brother
    w: brother
    pos: n
    tr: "erkek kardeş, ağabey"
    ex: "My [[brother]] is twelve years old."
    extr: "Erkek kardeşim on iki yaşında."
    d: 1
    ant: ["sister"]
    tone: ["Aile"]
    dis:
      - "bother | Rahatsız etmek demektir."
      - "brush | Fırça demektir."
      - "brown | Kahverengi demektir."
  - id: sister
    w: sister
    pos: n
    tr: "kız kardeş, abla"

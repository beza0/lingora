id: engineering-problem-solving
domain: engineering
title: "Sorun açıklama ve çözüm önerme"
desc: "Teknik sorunu tanımlama, nedenini söyleme, seçenekleri karşılaştırma ve öneri yapma."
sort: 3

targets:
  - id: issue
    w: issue
    pos: n
    tr: "sorun, mesele"
    ex: "We have an [[issue]] with the cooling system."
    extr: "Soğutma sisteminde bir sorunumuz var."
    d: 1
    col: ["an issue with", "fix an issue", "known issue"]
    syn: ["problem"]
    other: "“Sayı (dergi)” veya “yayımlamak” anlamına da gelir."
    tone: ["Teknik", "Toplantı"]
    dis:
      - "tissue | Doku veya kâğıt mendil demektir."
      - "image | Görüntü demektir."
      - "icon | Simge demektir."
  - id: overheat
    w: overheat
    pos: v
    tr: "aşırı ısınmak"
    ex: "The motor [[overheats]] after an hour of use."
    extr: "Motor bir saatlik kullanımdan sonra aşırı ısınıyor."
    d: 2
    fam: ["overheating (i.) aşırı ısınma"]
    tone: ["Teknik"]
    dis:
      - "overhears | Kulak misafiri olmak demektir."
      - "overeats | Aşırı yemek demektir."
      - "overheads | Genel giderler demektir."
  - id: leakage
    w: leakage
    pos: n
    tr: "sızıntı, kaçak"
    ex: "We found [[leakage]] at the pipe joint."
    extr: "Boru bağlantısında sızıntı bulduk."
    d: 2
    fam: ["leak (f.) sızdırmak"]
    tone: ["Teknik"]
    dis:
      - "linkage | Bağlantı mekanizması demektir."
      - "lineage | Soy demektir."
      - "luggage | Bagaj demektir."
  - id: vibration
    w: vibration
    pos: n
    tr: "titreşim"
    ex: "There is strong [[vibration]] at high speed."
    extr: "Yüksek hızda güçlü bir titreşim var."
    d: 2
    fam: ["vibrate (f.) titreşmek"]
    tone: ["Teknik"]
    dis:
      - "vibrant | Canlı demektir; sıfattır."
      - "violation | İhlal demektir."
      - "vacation | Tatil demektir."
  - id: solution
    w: solution
    pos: n
    tr: "çözüm"
    ex: "The simplest [[solution]] is to add a fan."
    extr: "En basit çözüm bir fan eklemek."
    d: 1
    fam: ["solve (f.) çözmek"]
    other: "Kimyada “çözelti” demektir."
    tone: ["Teknik", "Toplantı"]
    dis:
      - "solvent | Çözücü demektir."
      - "salutation | Selamlama demektir."
      - "solitude | Yalnızlık demektir."
  - id: component
    w: component
    pos: n
    tr: "bileşen, parça"
    ex: "We need to replace this [[component]] immediately."
    extr: "Bu bileşeni hemen değiştirmemiz gerekiyor."
    d: 2
    tone: ["Teknik"]
    dis:
      - "comment | Yorum demektir."
      - "compliment | İltifat demektir."
      - "competent | Yetkin demektir; sıfattır."
  - id: cause
    w: cause
    pos: v
    tr: "neden olmak"
    ex: "Dust can [[cause]] the sensor to fail."
    extr: "Toz, sensörün arızalanmasına neden olabilir."
    d: 2
    fam: ["cause (i.) neden"]
    tone: ["Teknik"]
    dis:
      - "case | Durum demektir; isimdir."
      - "pause | Duraklamak demektir."
      - "curse | Lanetlemek demektir."
  - id: prevent
    w: prevent
    pos: v
    tr: "önlemek"
    ex: "A filter will [[prevent]] dust from entering the unit."
    extr: "Bir filtre tozun üniteye girmesini önler."
    d: 2
    col: ["prevent something from …-ing"]
    fam: ["prevention (i.) önleme", "preventive (s.) önleyici"]
    tone: ["Teknik"]
    dis:
      - "present | Sunmak demektir."
      - "pretend | Rol yapmak demektir."
      - "prevail | Galip gelmek demektir."
  - id: feasible
    w: feasible
    pos: adj
    tr: "uygulanabilir, yapılabilir"
    ex: "Is it [[feasible]] to finish the redesign by May?"
    extr: "Yeniden tasarımı mayısa kadar bitirmek uygulanabilir mi?"
    d: 3
    fam: ["feasibility (i.) fizibilite, yapılabilirlik"]
    tone: ["Toplantı", "Resmî"]
    dis:
      - "visible | Görünür demektir."
      - "festive | Bayram havasında demektir."
      - "fusible | Eriyebilir demektir."
  - id: cost-effective
    w: cost-effective
    pos: adj
    tr: "maliyet açısından verimli"
    ex: "Option B is more [[cost-effective]] in the long term."
    extr: "B seçeneği uzun vadede maliyet açısından daha verimli."
    d: 3
    tone: ["Toplantı", "Rapor"]
    dis:
      - "costume | Kostüm demektir."
      - "coastal | Kıyı ile ilgili demektir."
      - "cosmetic | Görünüşle ilgili demektir."
  - id: risk
    w: risk
    pos: n
    tr: "risk, tehlike olasılığı"
    ex: "There is a [[risk]] of fire if the cable overheats."
    extr: "Kablo aşırı ısınırsa yangın riski var."
    d: 1
    col: ["risk of", "reduce the risk"]
    tone: ["Teknik", "Güvenlik"]
    dis:
      - "rusk | Peksimet demektir."
      - "disk | Disk demektir."
      - "rink | Buz pateni pisti demektir."
  - id: trade-off
    w: trade-off
    pos: n
    tr: "ödünleşim (birini kazanırken diğerinden vazgeçme)"
    ex: "There's a [[trade-off]] between weight and strength."
    extr: "Ağırlık ile dayanım arasında bir ödünleşim var."
    d: 3
    tone: ["Toplantı", "Teknik"]
    dis:
      - "take-off | Kalkış demektir."
      - "trademark | Ticari marka demektir."
      - "trade fair | Ticaret fuarı demektir."
  - id: temporary
    w: temporary
    pos: adj
    tr: "geçici"
    ex: "This is a [[temporary]] fix until the new part arrives."
    extr: "Bu, yeni parça gelene kadar geçici bir çözüm."
    d: 2
    ant: ["permanent"]
    tone: ["Teknik"]
    dis:
      - "temporal | Zamanla ilgili demektir; “geçici” anlamı vermez."
      - "contemporary | Çağdaş demektir."
      - "temperature | Sıcaklık demektir; isimdir."
  - id: permanent
    w: permanent
    pos: adj
    tr: "kalıcı"
    ex: "We need a [[permanent]] solution, not a quick fix."
    extr: "Hızlı bir yama değil, kalıcı bir çözüme ihtiyacımız var."
    d: 2
    ant: ["temporary"]
    tone: ["Teknik"]
    dis:
      - "pertinent | İlgili demektir."
      - "prominent | Önde gelen demektir."
      - "permitted | İzin verilmiş demektir."
  - id: shut-down
    w: shut down
    pos: phrasal
    tr: "(sistemi, makineyi) kapatmak"
    ex: "Please [[shut down]] the machine before cleaning it."
    extr: "Lütfen temizlemeden önce makineyi kapat."
    d: 2
    fam: ["shutdown (i.) kapatma, duruş"]
    tone: ["Güvenlik", "Kılavuz"]
    dis:
      - "shut up | “Sus” demektir; kabadır."
      - "shot down | Vurulup düşürüldü demektir."
      - "shut out | Dışarıda bırakmak demektir."
  - id: inspect
    w: inspect
    pos: v
    tr: "muayene etmek, denetlemek"
    ex: "We [[inspect]] the welds once a week."
    extr: "Kaynakları haftada bir muayene ediyoruz."
    d: 2
    fam: ["inspection (i.) muayene, denetim", "inspector (i.) denetçi"]
    tone: ["Teknik", "Kalite"]
    dis:
      - "insect | Böcek demektir."
      - "inspire | İlham vermek demektir."
      - "expect | Beklemek demektir."
  - id: maintenance
    w: maintenance
    pos: n
    tr: "bakım"
    ex: "The machine needs regular [[maintenance]]."
    extr: "Makinenin düzenli bakıma ihtiyacı var."
    d: 2
    col: ["regular maintenance", "maintenance schedule"]
    fam: ["maintain (f.) bakımını yapmak, korumak"]
    tone: ["Teknik"]
    dis:
      - "maintain | Fiildir; burada isim gerekir."
      - "mainland | Anakara demektir."
      - "attendance | Katılım demektir."
  - id: downtime
    w: downtime
    pos: n
    tr: "duruş süresi (sistemin çalışmadığı süre)"
    ex: "The repair caused six hours of [[downtime]]."
    extr: "Onarım altı saatlik duruşa neden oldu."
    d: 3
    tone: ["Teknik", "Üretim"]
    dis:
      - "downtown | Şehir merkezi demektir."
      - "download | İndirme demektir."
      - "downturn | Durgunluk demektir."
  - id: propose

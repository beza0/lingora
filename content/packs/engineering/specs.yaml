    ex: "[[According to]] the datasheet, the maximum load is 5 kN."
    extr: "Veri sayfasına göre azami yük 5 kN."
    ttr: "Şuna göre azami yük 5 kN: …."
    slots: ["the datasheet | veri sayfası", "the manual | kullanım kılavuzu", "the standard | standart"]
    chunks: ["According to the datasheet | veri sayfasına göre", "the maximum load is 5 kN | bilgi"]
    g: present-simple
    ctx: ["Rapor", "Teknik toplantı"]
    tone: ["Resmî"]
    d: 2
    dis:
      - "Accordingly to | “Accordingly” “buna göre” anlamında bir zarftır."
      - "According with | Edat yanlış."
      - "Regarding to | “Regarding” “to” almaz."

grammar:
  - id: comparatives
    title: "Karşılaştırma (comparatives)"
    short: "Kısa sıfatlar -er ve than alır: lighter than. Uzun sıfatlarda more kullanılır: more efficient than."
    long: "Düzensiz biçimler: good → better, bad → worse. Farkın büyüklüğü: much / far / slightly + -er: much lighter, slightly heavier. Eşitlik: as … as: as strong as steel. Kat: twice as heavy as. En üstünlük: the lightest, the most efficient. “more heavier” gibi çift karşılaştırma yanlıştır."
    ex: ["The new motor is more efficient than the old one. | Yeni motor eskisinden daha verimli.", "Aluminum is much lighter than steel. | Alüminyum çelikten çok daha hafif.", "This part is twice as heavy as that one. | Bu parça ötekinin iki katı ağır."]
  - id: measurements-numbers
    title: "Ölçü ve sayıları söyleme"
    short: "Boyut: 60 by 120 cm (altmışa yüz yirmi). Ondalık ayırıcı noktadır ve “point” diye okunur: 0.05 = zero point zero five."
    long: "Binlik ayırıcı virgüldür: 1,000. ± “plus or minus” diye okunur. Birim çoğulu: 2 kilograms; sıfat olarak tekil: a 2-kilogram part. Oranlar “per” ile: 30 liters per minute. Aralık: from −20 to 60 degrees Celsius. up to = -e kadar (üst sınır)."
    ex: ["The plate measures 200 by 300 mm. | Plaka 200'e 300 mm boyutunda.", "The tolerance is plus or minus 0.05 mm. | Tolerans artı eksi 0,05 mm.", "The pump can deliver up to 40 liters per minute. | Pompa dakikada 40 litreye kadar basabilir."]

scenarios:
  - id: supplier-call
    title: "Tedarikçiyle teknik görüşme"
    sit: "Bir tedarikçiyle yeni bir pompanın teknik özelliklerini konuşuyorsun."
    d: 2
    targets: [per, capacity, specification]
    turns:
      - ["Supplier", "This model can pump up to 40 liters per minute.", "Bu model dakikada 40 litreye kadar pompalayabilir."]
      - choose:
          - ["That's good. What's the total weight of the unit?", true, "Doğru ve ilgili bir soru soruyor."]
          - ["That's good. What's the total wait of the unit?", false, "“wait” beklemek demektir."]
          - ["That's good. How much weights the unit?", false, "Soru yapısı bozuk; doğrusu “How much does it weigh?”"]
      - ["Supplier", "It weighs about 18 kg, and the tank capacity is 50 liters.", "Yaklaşık 18 kg ağırlığında ve depo kapasitesi 50 litre."]
      - choose:
          - ["Great. Could you send me the datasheet with all the specifications?", true, "Kibar ve somut bir istek."]
          - ["Great. Could you send me the datasheet with all the speculations?", false, "“speculations” spekülasyon demektir."]
          - ["Great. Could you sent me the datasheet?", false, "“could” sonrası fiil yalın olur: send."]
  - id: material-choice
    title: "Malzeme seçimi"
    sit: "Ekip toplantısında bir drone gövdesi için malzeme seçiyorsunuz."
    d: 2
    targets: [lightweight, durable, compared-to]
    turns:
      - ["Engineer", "Should we use steel or aluminum for the frame?", "Gövde için çelik mi alüminyum mu kullanalım?"]
      - choose:
          - ["Aluminum. Compared to steel, it's much lighter, and we need a lightweight frame.", true, "Seçimi doğru bir gerekçeyle yapıyor."]
          - ["Aluminum, because it is more heavier than steel.", false, "“more heavier” yanlış; ayrıca alüminyum çelikten hafiftir."]
          - ["Steel, because it's lighter than aluminum.", false, "Teknik olarak yanlış: çelik alüminyumdan ağırdır."]
      - ["Engineer", "But is it durable enough in wet conditions?", "Peki ıslak koşullarda yeterince dayanıklı mı?"]
      - choose:
          - ["Yes, if we add a protective coating.", true, "Koşulu belirterek yanıt veriyor."]
          - ["Yes, it is enough durable.", false, "Kelime sırası yanlış: durable enough."]
          - ["Yes, it's during in wet conditions.", false, "“during” bir edattır."]


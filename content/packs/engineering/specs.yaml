    q:
      - q: "Pompa hangi sıcaklıkta çalıştırılmamalı?"
        o: ["0 °C", "50 °C", "95 °C"]
        a: 2
        why: "Çalışma aralığı −10 ile 80 °C arası; 95 °C bu aralığın dışında."
      - q: "Pompanın gövdesi hangi malzemeden?"
        o: ["Alüminyum", "Paslanmaz çelik", "Plastik"]
        a: 1
        why: "“Housing material: stainless steel.”"
      - q: "Pompa dakikada en fazla ne kadar sıvı basabilir?"
        o: ["18 litre", "40 litre", "80 litre"]
        a: 1
        why: "“Maximum flow rate: 40 liters per minute.”"
  - id: measurement-email
    title: "Measurement results"
    kind: "E-posta"

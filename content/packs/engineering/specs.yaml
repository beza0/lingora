    tone: ["Uyarı"]
    d: 2
    dis:
      - "excess | İsimdir; burada fiil gerekir."
      - "exceeds | “should not” sonrası fiil yalın olur."
      - "accede | Kabul etmek demektir."
  - id: compared-to

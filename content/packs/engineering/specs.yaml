    ex: "[[Compared to]] steel, aluminum is much lighter."
    extr: "Çelikle karşılaştırıldığında alüminyum çok daha hafif."
    ttr: "Alüminyum şununla karşılaştırıldığında çok daha hafif: …."
    slots: ["steel | çelik", "copper | bakır", "cast iron | dökme demir"]
    chunks: ["Compared to steel | çelikle karşılaştırıldığında", "aluminum is much lighter | alüminyum çok daha hafif"]
    g: comparatives
    ctx: ["Teknik toplantı", "Rapor"]
    tone: ["Nötr"]

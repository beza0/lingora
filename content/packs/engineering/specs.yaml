    extr: "Sıcaklık 80 °C'yi aşmamalı."
    ttr: "Sıcaklık şunu aşmamalı: …."
    slots: ["80 °C | 80 °C", "the rated value | anma değeri", "the safety limit | güvenlik sınırı"]
    chunks: ["The temperature | sıcaklık", "should not exceed | aşmamalı", "80 °C | sınır"]

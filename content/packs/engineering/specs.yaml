patterns:
  - id: x-er-than
    t: "… is …-er than …"
    ex: "The new pump is [[quieter than]] the old one."
    extr: "Yeni pompa eskisinden daha sessiz."
    ttr: "Yeni pompa eskisinden daha …."
    slots: ["quieter | sessiz", "lighter | hafif", "more efficient | verimli"]
    chunks: ["The new pump | yeni pompa", "is quieter than | -den daha sessiz", "the old one | eskisi"]
    g: comparatives
    ctx: ["Teknik toplantı", "Rapor"]
    tone: ["Nötr"]
    d: 1
    dis:
      - "more quiet as | Karşılaştırmada “than” kullanılır."
      - "quietest than | En üstünlük biçimi “than” ile kullanılmaz."
      - "quieter that | “that” yerine “than” gerekir."
  - id: measures-by
    t: "It measures … by …"
    ex: "The panel [[measures]] 60 by 120 cm."
    extr: "Panel 60'a 120 cm boyutunda."
    ttr: "Panelin ölçüsü: …."
    slots: ["60 by 120 cm | 60'a 120 cm", "1.2 by 2.4 m | 1,2'ye 2,4 m", "30 by 40 mm | 30'a 40 mm"]
    chunks: ["The panel | panel", "measures | … ölçüsünde", "60 by 120 cm | en × boy"]
    g: measurements-numbers
    ctx: ["Teknik özellik"]
    tone: ["Nötr"]
    d: 2
    dis:
      - "measure | Tekil özne -s ister."
      - "measuring | Çekimli fiil gerekir."
      - "is measure | “is” ile yalın fiil birlikte kullanılmaz."
  - id: made-of
    t: "It's made of …"
    ex: "The housing is [[made of]] stainless steel."
    extr: "Gövde paslanmaz çelikten yapılmış."
    ttr: "Gövde şundan yapılmış: …."
    slots: ["stainless steel | paslanmaz çelik", "aluminum | alüminyum", "recycled plastic | geri dönüştürülmüş plastik"]
    chunks: ["The housing | gövde", "is made of | -den yapılmış", "stainless steel | malzeme"]
    g: passive-voice-basics
    ctx: ["Teknik özellik"]
    tone: ["Nötr"]
    d: 1
    dis:
      - "made by | “by” yapan kişiyi veya firmayı bildirir."
      - "make of | Edilgen yapı gerekir: made."
      - "made at | Malzeme için “of” kullanılır."
    alt: ["The housing is made from stainless steel."]
  - id: operates-at
    t: "It operates at …"
    ex: "The system [[operates at]] 24 volts."
    extr: "Sistem 24 voltta çalışır."
    ttr: "Sistem şu değerde çalışır: …."
    slots: ["24 volts | 24 volt", "a pressure of 6 bar | 6 bar basınç", "50 hertz | 50 hertz"]
    chunks: ["The system | sistem", "operates at | … değerinde çalışır", "24 volts | değer"]
    g: present-simple
    ctx: ["Teknik özellik"]
    tone: ["Nötr"]
    d: 2
    dis:
      - "operates in | Değer bildirirken “at” kullanılır."
      - "operate at | Tekil özne -s ister."
      - "operating at | Çekimli fiil gerekir."
  - id: up-to
    t: "It can … up to …"
    ex: "The crane can lift [[up to]] two tons."
    extr: "Vinç iki tona kadar kaldırabilir."
    ttr: "Vinç şuna kadar kaldırabilir: …."
    slots: ["two tons | iki ton", "500 kg | 500 kg", "1,000 kg | 1.000 kg"]
    chunks: ["The crane can lift | vinç kaldırabilir", "up to | -e kadar", "two tons | üst sınır"]

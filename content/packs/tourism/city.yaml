grammar:
  - id: ordering-food
    title: "Sipariş vermek: I'll have …, Could I get …?, without …"
    short: "Restoranda sipariş “I'll have …” ya da “Could I get …?” ile verilir; değişiklik “with / without / on the side” ile istenir."
    long: "Sipariş: I'll have the chicken. / Could I get a coffee, please? Değişiklik: without onions (soğansız), with extra cheese (ekstra peynirli), dressing on the side (sos ayrı). Soru: Does it come with …? / Does this contain nuts? Hesap: Could we have the check, please? / Can we pay separately? Garsonun sorusu: Are you ready to order? / Anything else?"
    ex: ["I'll have the pasta without mushrooms. | Mantarsız makarna alayım.", "Could I get the dressing on the side? | Sosu ayrı alabilir miyim?", "Can we pay separately? | Ayrı ayrı ödeyebilir miyiz?"]
  - id: transport-prepositions
    title: "Ulaşım edatları: by bus, on foot, get on / get off, change at"
    short: "Araçla gitmek “by + araç”, yürümek “on foot”; araca binmek “get on”, inmek “get off”, aktarma “change at”."
    long: "by bus / by train / by taxi (araçla), on foot (yürüyerek). Otobüs ve trene: get on / get off; arabaya ve taksiye: get in / get out of. Aktarma: change at Central Station. Durak: at the next stop. Yön: towards the city centre (merkeze doğru). Süre: It takes 20 minutes by bus."
    ex: ["It takes 20 minutes by bus. | Otobüsle 20 dakika sürüyor.", "Get off at the third stop. | Üçüncü durakta inin.", "Change at Central Station for line 2. | 2 numaralı hat için Merkez İstasyonu'nda aktarma yapın."]

scenarios:
  - id: restaurant-order
    title: "Restoranda sipariş"
    sit: "Arkadaşınla bir restorandasın. Fındık alerjin var ve sipariş vermek istiyorsun."
    d: 1
    targets: [contain, menu, the-check]
    turns:
      - ["Waiter", "Good evening. Are you ready to order?", "İyi akşamlar. Sipariş vermeye hazır mısınız?"]
      - choose:
          - ["Yes. Does the chicken salad contain nuts? I'm allergic.", true, "Alerjisini söyleyip içeriği soruyor."]
          - ["Yes, give chicken.", false, "Kaba ve eksik."]
          - ["Yes, I'm allergy nuts.", false, "“allergic to nuts” olmalı."]
      - ["Waiter", "It has walnuts, but we can make it without them.", "İçinde ceviz var ama onsuz yapabiliriz."]
      - choose:
          - ["Great, I'll have it without walnuts, please.", true, "“I'll have … without …” ile doğru sipariş."]
          - ["OK, I have it with walnuts.", false, "Alerjisi var; mantıksız."]
          - ["Great, I'll having it.", false, "“will” sonrası yalın fiil gelir."]
      - ["Waiter", "Perfect. And to drink?", "Harika. İçecek olarak?"]
  - id: buying-transport-ticket
    title: "Toplu taşıma bileti almak"
    sit: "Metro istasyonundasın. Gün boyunca şehri gezeceksin ve hangi bileti alacağını soruyorsun."
    d: 2
    targets: [day-pass, change-trains, stop]
    turns:
      - ["Staff", "Hi, can I help you?", "Merhaba, yardımcı olabilir miyim?"]
      - choose:
          - ["Yes, I'm going to travel around the city all day. Which ticket should I buy?", true, "Planını söyleyip doğru soruyu soruyor."]
          - ["Ticket, all day, which?", false, "Cümle kurulmamış."]
          - ["I want to buy the metro.", false, "Metroyu satın almak anlamına geliyor."]
      - ["Staff", "A day pass is best. It's 8 euros and you can use buses and trains.", "Günlük kart en iyisi. 8 avro, otobüs ve trenlerde kullanabilirsiniz."]
      - choose:
          - ["Great. And which line goes to the museum?", true, "Bilgiyi alıp yol soruyor."]
          - ["Great. Which line go to museum?", false, "Fiil çekimi ve tanımlık eksik."]
          - ["Is it free?", false, "Fiyat zaten söylendi."]
      - ["Staff", "Take line 2 and change at Central Station. Get off at the third stop.", "2 numaralı hatta binin ve Merkez İstasyonu'nda aktarma yapın. Üçüncü durakta inin."]

readings:
  - id: museum-info
    title: "Visitor information"
    kind: "Müze bilgilendirmesi"
    d: 2
    s:
      - ["The museum is open from 9 am to 6 pm, Tuesday to Sunday.", "Müze salıdan pazara 09.00–18.00 arası açıktır."]
      - ["Last admission is one hour before closing.", "Son giriş, kapanıştan bir saat öncedir."]
      - ["Tickets are cheaper online, and admission is free for under-18s.", "Biletler internetten daha ucuzdur ve 18 yaş altı için giriş ücretsizdir."]
      - ["Free guided tours in English start at 11 am and 3 pm.", "İngilizce ücretsiz rehberli turlar 11.00 ve 15.00'te başlar."]
      - ["Large bags must be left in the cloakroom.", "Büyük çantalar vestiyere bırakılmalıdır."]
    gloss: ["last admission | son giriş", "under-18s | 18 yaş altındakiler", "cloakroom | vestiyer, emanet"]
    q:
      - q: "Müze hangi gün kapalı?"
        o: ["Pazartesi", "Salı", "Pazar"]
        a: 0
        why: "“open … Tuesday to Sunday” — pazartesi yok."
      - q: "Saat 17.30'da müzeye girilebilir mi?"
        o: ["Evet", "Hayır, son giriş 17.00", "Yalnız rehberli turla"]
        a: 1
        why: "“Last admission is one hour before closing.” Kapanış 18.00."
  - id: restaurant-review
    title: "A short review"
    kind: "Restoran yorumu"
    d: 2

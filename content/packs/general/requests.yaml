    tr: "Bana bir iyilik yapabilir misin?"
    ex: "[[Could you do me a favor]] and water my plants this weekend?"
    extr: "Bana bir iyilik yapıp bu hafta sonu bitkilerimi sular mısın?"
    d: 2
    tone: ["Samimi", "Nazik"]
    dis:
      - "Could you do me a flavor | “flavor” tat demektir."
      - "Could you make me a favor | Kalıp “do someone a favor” biçimindedir."
      - "Could you do me favorite | “favorite” en sevilen demektir."
  - id: not-what-ordered

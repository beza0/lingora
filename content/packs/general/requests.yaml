id: general-requests
domain: general
title: "İstekler ve sorunlar"
desc: "Restoranda, mağazada ve evde bir şey isteme, sorun bildirme ve kibarca şikâyet etme."
sort: 3

targets:
  - id: refund
    w: refund
    pos: n
    tr: "para iadesi"
    ex: "I'd like a [[refund]] for these shoes."
    extr: "Bu ayakkabılar için paramı geri istiyorum."
    d: 2
    col: ["get a refund", "full refund"]
    fam: ["refund (f.) parayı iade etmek"]
    tone: ["Mağaza", "Resmî"]
    dis:
      - "refill | Yeniden doldurma demektir."
      - "reform | Köklü değişiklik demektir."
      - "referee | Hakem demektir."
  - id: receipt
    w: receipt
    pos: n
    tr: "fiş, makbuz"
    ex: "Do you have the [[receipt]]?"
    extr: "Fişiniz var mı?"
    d: 2
    conf: ["recipe | Yemek tarifi demektir; yazılışı benzer."]
    tone: ["Mağaza"]
    dis:
      - "recipe | Yemek tarifi demektir."
      - "receiver | Alıcı demektir."
      - "reception | Resepsiyon demektir."
  - id: broken
    w: broken
    pos: adj
    tr: "bozuk, kırık"
    ex: "The heater in my room is [[broken]]."
    extr: "Odamdaki ısıtıcı bozuk."
    d: 1
    fam: ["break (f.) kırmak, bozmak"]
    tone: ["Günlük"]
    dis:
      - "spoken | Konuşulmuş demektir."
      - "brokers | Komisyoncular demektir."
      - "braking | Fren yapan demektir."
  - id: complaint
    w: complaint
    pos: n
    tr: "şikâyet"
    ex: "I'd like to make a [[complaint]] about the noise."
    extr: "Gürültü hakkında şikâyette bulunmak istiyorum."
    d: 2
    col: ["make a complaint", "complaint about"]
    fam: ["complain (f.) şikâyet etmek"]
    conf: ["compliment | İltifat demektir; anlamı tam tersidir."]
    tone: ["Resmî"]
    dis:
      - "compliment | İltifat demektir; anlamı tersine çevirir."
      - "complaining | “make a” sonrası isim gerekir."
      - "complement | Tamamlayıcı demektir."
  - id: exchange
    w: exchange
    pos: v
    tr: "(ürünü başka biriyle) değiştirmek"
    ex: "Can I [[exchange]] this shirt for a smaller size?"
    extr: "Bu gömleği daha küçük bir bedenle değiştirebilir miyim?"
    d: 2
    col: ["exchange something for something", "exchange rate"]
    tone: ["Mağaza"]
    dis:
      - "exclude | Hariç tutmak demektir."
      - "expand | Genişletmek demektir."
      - "excite | Heyecanlandırmak demektir."
  - id: bill
    w: bill
    pos: n
    tr: "hesap (restoranda), fatura"
    ex: "Could we have the [[bill]], please?"
    extr: "Hesabı alabilir miyiz, lütfen?"
    d: 1
    syn: ["check (Amerikan İngilizcesi)"]
    tone: ["Restoran", "Nazik"]
    dis:
      - "bell | Zil demektir."
      - "pill | Hap demektir."
      - "build | İnşa etmek demektir."
  - id: leak
    w: leak
    pos: v
    tr: "sızdırmak, damlatmak"

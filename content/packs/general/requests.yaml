    extr: "Mutfak musluğu damlatıyor."
    d: 2
    fam: ["leak (i.) sızıntı"]
    tone: ["Ev"]
    dis:
      - "licking | Yalamak demektir."
      - "leaving | Ayrılmak demektir."
      - "looking | Bakmak demektir."
  - id: replace
    w: replace
    pos: v
    tr: "yerine yenisini koymak"
    ex: "Can you [[replace]] the light bulb in the bathroom?"
    extr: "Banyodaki ampulü değiştirebilir misin?"
    d: 2
    fam: ["replacement (i.) yenisi, yedek"]
    tone: ["Ev"]
    dis:
      - "reply | Cevap vermek demektir."
      - "relax | Rahatlamak demektir."
      - "repeat | Tekrarlamak demektir."
  - id: available
    w: available
    pos: adj

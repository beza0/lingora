patterns:
  - id: id-like
    t: "I'd like …, please."
    ex: "I'd [[like]] a glass of water, please."
    extr: "Bir bardak su istiyorum, lütfen."
    ttr: "… istiyorum, lütfen."
    slots: ["a glass of water | bir bardak su", "the chicken salad | tavuklu salata", "a table for two | iki kişilik bir masa"]
    chunks: ["I'd like | istiyorum (kibar)", "a glass of water | istenen şey", "please | lütfen"]
    g: would-like
    ctx: ["Restoran", "Mağaza"]
    tone: ["Nazik"]
    d: 1
    dis:
      - "likes | “I'd” sonrası fiil yalın olur."
      - "liked | “I'd” sonrası geçmiş hâl gelmez."
      - "love to | İsimden önce “to” gelmez."
    alt: ["I would like a glass of water, please."]
  - id: could-i-have
    t: "Could I have …?"
    ex: "Could I [[have]] the menu, please?"
    extr: "Menüyü alabilir miyim, lütfen?"
    ttr: "Şunu alabilir miyim: …?"
    slots: ["the menu | menü", "some more bread | biraz daha ekmek", "the Wi-Fi password | Wi-Fi şifresi"]
    chunks: ["Could I | -ebilir miyim", "have | al-", "the menu | istenen şey"]
    g: can-have-to
    ctx: ["Restoran", "Otel"]
    tone: ["Nazik"]
    d: 1
    dis:
      - "has | “could” sonrası fiil yalın olur."
      - "having | “could” sonrası fiil yalın olur."
      - "had | “could” sonrası geçmiş hâl gelmez."
  - id: is-it-okay-if
    t: "Is it okay if I …?"
    ex: "Is it okay [[if]] I open the window?"
    extr: "Pencereyi açsam olur mu?"
    ttr: "Şunu yapsam olur mu: …?"
    slots: ["open the window | pencereyi açmak", "leave a bit early | biraz erken çıkmak", "sit here | buraya oturmak"]
    chunks: ["Is it okay | olur mu", "if I | -sam", "open the window | eylem"]
    g: can-have-to
    ctx: ["İzin isteme"]
    tone: ["Nazik"]
    d: 2
    dis:
      - "when | Zaman bildirir; izin istemez."
      - "whether | Bu kalıpta kullanılmaz."
      - "so | Sonuç bildirir."
  - id: problem-with
    t: "There's a problem with …"
    ex: "There's a problem [[with]] my room key."
    extr: "Oda anahtarımda bir sorun var."
    ttr: "Şunda bir sorun var: …."
    slots: ["my room key | oda anahtarım", "the shower | duş", "my order | siparişim"]
    chunks: ["There's a problem | bir sorun var", "with | … ile ilgili", "my room key | sorunlu şey"]
    g: present-simple
    ctx: ["Otel", "Mağaza"]
    tone: ["Nötr"]
    d: 1
    dis:
      - "on | Edat yanlış: with."
      - "for | Edat yanlış: with."
      - "at | Edat yanlış: with."
  - id: doesnt-work
    t: "The … doesn't work."
    ex: "The air conditioner [[doesn't]] work."
    extr: "Klima çalışmıyor."
    ttr: "… çalışmıyor."
    slots: ["air conditioner | klima", "TV | televizyon", "elevator | asansör"]
    chunks: ["The air conditioner | arızalı şey", "doesn't work | çalışmıyor"]
    g: present-simple
    ctx: ["Otel", "Ev"]
    tone: ["Nötr"]
    d: 1
    dis:
      - "don't | Tekil özne ile “doesn't” gerekir."
      - "isn't | Fiil cümlesinde “doesn't” gerekir."
      - "not | Yardımcı fiil eksik."
    alt: ["The air conditioner does not work."]
  - id: how-much
    t: "How much is …?"
    ex: "How much [[is]] this backpack?"
    extr: "Bu sırt çantası ne kadar?"
    ttr: "… ne kadar?"
    slots: ["this backpack | bu sırt çantası", "a ticket to Ankara | Ankara'ya bir bilet", "the room per night | odanın gecelik fiyatı"]
    chunks: ["How much | ne kadar", "is | -dir", "this backpack | ürün"]
    g: to-be
    ctx: ["Mağaza"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "are | Tekil isimle “is” gerekir."
      - "does | “does” ile soruda fiil (cost) gerekir."
      - "many | “How many” sayı sorar."
  - id: help-me
    t: "Can you help me …?"
    ex: "Can you help me [[carry]] these boxes?"
    extr: "Bu kutuları taşımama yardım edebilir misin?"
    ttr: "Şunu yapmama yardım edebilir misin: …?"
    slots: ["carry these boxes | bu kutuları taşımak", "find the station | istasyonu bulmak", "fill in this form | bu formu doldurmak"]
    chunks: ["Can you help me | bana yardım edebilir misin", "carry these boxes | eylem (yalın fiil)"]
    g: can-have-to
    ctx: ["Yardım isteme"]
    tone: ["Samimi"]
    d: 1
    dis:
      - "carrying | “help me” sonrası yalın fiil (veya to + fiil) gelir."
      - "carries | Çekimli fiil gelmez."
      - "carried | Geçmiş hâl gelmez."
    alt: ["Can you help me to carry these boxes?"]
  - id: was-charged
    t: "I think I was charged …"
    ex: "I think I [[was charged]] twice for this."
    extr: "Sanırım bunun için benden iki kez ücret alındı."
    ttr: "Sanırım benden ücret alındı: …."
    slots: ["twice for this | bunun için iki kez", "too much | fazla", "for a room I didn't book | ayırtmadığım bir oda için"]
    chunks: ["I think | sanırım", "I was charged | benden ücret alındı", "twice | iki kez"]
    g: passive-voice-basics
    ctx: ["Mağaza", "Otel", "Banka"]
    tone: ["Nazik"]
    d: 3
    dis:
      - "was charge | Edilgen yapıda fiilin 3. hâli gerekir."
      - "were charged | “I” ile “was” kullanılır."
      - "is charged | “I” ile “is” kullanılmaz."
  - id: would-you-mind
    t: "Would you mind …-ing?"
    ex: "Would you mind [[turning]] the music down?"
    extr: "Müziğin sesini kısar mısınız?"
    ttr: "Şunu yapar mısınız: …?"
    slots: ["turning the music down | müziğin sesini kısmak", "closing the door | kapıyı kapatmak", "waiting a minute | bir dakika beklemek"]
    chunks: ["Would you mind | … mısınız (çok nazik)", "turning the music down | eylem (-ing)"]
    g: would-like
    ctx: ["Komşu", "Rica"]
    tone: ["Çok nazik"]
    d: 2
    dis:
      - "turn | “mind” sonrası fiil -ing alır."
      - "to turn | “mind” sonrası “to” gelmez."
      - "turned | Geçmiş hâl gelmez."
  - id: ordered-but
    t: "I ordered …, but I got …"
    ex: "I ordered a medium, [[but]] I got a large."
    extr: "Orta boy sipariş ettim ama bana büyük boy geldi."
    ttr: "Şunu sipariş ettim ama başka bir şey geldi: …."
    slots: ["a medium | orta boy", "two coffees | iki kahve", "the vegetarian pizza | vejetaryen pizza"]
    chunks: ["I ordered | sipariş ettim", "a medium | istenen", "but I got a large | ama gelen"]
    g: past-simple-reporting
    ctx: ["Restoran", "Online alışveriş"]
    tone: ["Nötr"]
    d: 2
    dis:
      - "so | Sonuç bildirir; burada karşıtlık için “but” gerekir."
      - "because | Neden bildirir."
      - "or | Seçenek bildirir."

grammar:
  - id: would-like
    title: "would like ve would you mind"
    short: "Bir şey isterken I'd like + isim ya da I'd like to + fiil kibar bir yoldur: I'd like a refund. I'd like to speak to the manager."
    long: "I want daha doğrudandır; restoranda ve mağazada I'd like tercih edilir. Teklif: Would you like some tea? Çok nazik rica: Would you mind + -ing: Would you mind closing the window? Buna “No, not at all.” yanıtı “Hayır, hiç sorun değil” demektir; yani rica kabul edilmiştir."
    ex: ["I'd like the soup, please. | Çorba alayım, lütfen.", "Would you like a coffee? | Kahve ister misin?", "Would you mind waiting a minute? | Bir dakika bekler misiniz?"]
  - id: can-have-to
    title: "can, could ve have to"
    short: "can/could yetenek, izin ve rica bildirir: Can I sit here? Could you help me? have to zorunluluk bildirir: I have to leave early."
    long: "can ve could sonrası yalın fiil gelir, “to” gelmez. could, can'den daha naziktir. have to, he/she/it ile has to olur. Olumsuzu farklıdır: don't have to “gerek yok”, mustn't “yasak” demektir. Sık kalıp: I can't make it = gelemiyorum, yetişemiyorum."
    ex: ["Could I have the bill, please? | Hesabı alabilir miyim, lütfen?", "I have to work late tonight. | Bu akşam geç saate kadar çalışmam gerekiyor.", "You don't have to bring anything. | Bir şey getirmene gerek yok."]

scenarios:
  - id: hotel-problem
    title: "Otelde arıza bildirme"
    sit: "Otel odanda klima çalışmıyor. Resepsiyonu arıyorsun."
    d: 1
    targets: [doesnt-work, fix, could-i-have]
    turns:
      - ["Receptionist", "Good evening, reception. How can I help you?", "İyi akşamlar, resepsiyon. Size nasıl yardımcı olabilirim?"]
      - choose:
          - ["Hi, this is room 304. The air conditioner doesn't work.", true, "Oda numarasını ve sorunu net söylüyor."]
          - ["Hi, room 304. The air conditioner don't work.", false, "Tekil özne ile “doesn't” gerekir."]
          - ["Hi, I'm the air conditioner in room 304.", false, "Kendini klima olarak tanıtıyor; anlamsız."]
      - ["Receptionist", "I'm sorry about that. Someone will come to fix it in ten minutes.", "Bunun için üzgünüm. On dakika içinde biri gelip tamir edecek."]
      - choose:
          - ["Thank you. Could I also have an extra blanket, please?", true, "Teşekkür ediyor ve kibar bir ek istekte bulunuyor."]
          - ["Thank you. Could I also has an extra blanket?", false, "“could” sonrası fiil yalın olur: have."]
          - ["Thank you, but it's not urgent, so fix it now.", false, "Çelişkili: acil değil deyip hemen istiyor."]
  - id: exchange-shirt
    title: "Mağazada ürün değiştirme"
    sit: "Dün aldığın gömlek küçük geldi. Mağazada daha büyük bir bedenle değiştirmek istiyorsun."
    d: 2
    targets: [exchange, receipt, refund]
    turns:
      - ["Shop assistant", "Hello! Can I help you?", "Merhaba! Yardımcı olabilir miyim?"]
      - choose:
          - ["Yes, I bought this shirt yesterday, but it's too small. Can I exchange it for a medium?", true, "Durumu ve isteğini açık ve kibar biçimde anlatıyor."]
          - ["Yes, I buyed this shirt, it's too small.", false, "“buy” düzensiz bir fiildir: bought."]
          - ["Yes, can I exchange me a medium?", false, "Yapı bozuk; doğrusu “exchange it for a medium”."]
      - ["Shop assistant", "Of course. Do you have the receipt?", "Elbette. Fişiniz var mı?"]
      - choose:
          - ["Yes, here it is.", true, "Bir şeyi uzatırken kullanılan doğal kalıp."]
          - ["Yes, here is it.", false, "Kelime sırası yanlış: here it is."]
          - ["Yes, I have the recipe.", false, "“recipe” yemek tarifidir."]

readings:
  - id: complaint-email
    title: "Complaint: damaged order"
    kind: "E-posta"
    d: 2
    s:
      - ["Dear Customer Service, I ordered a coffee machine from your website on 3 May.", "Sayın Müşteri Hizmetleri, 3 Mayıs'ta web sitenizden bir kahve makinesi sipariş ettim."]
      - ["It was delivered yesterday, but the box arrived damaged and the machine doesn't work.", "Dün teslim edildi ama kutu hasarlı geldi ve makine çalışmıyor."]
      - ["I'd like to exchange it for a new one or get a full refund.", "Makineyi yenisiyle değiştirmek ya da paramın tamamını geri almak istiyorum."]
      - ["I've attached a photo of the box and my receipt.", "Kutunun fotoğrafını ve fişimi ekledim."]
    gloss: ["delivered | teslim edildi", "damaged | hasarlı", "refund | para iadesi", "attached | (e-postaya) ekledim"]
    q:
      - q: "Sorun ne?"
        o: ["Sipariş hiç gelmedi", "Kutu hasarlı geldi ve makine çalışmıyor", "Yanlış renk geldi"]
        a: 1
        why: "“the box arrived damaged and the machine doesn't work”"
      - q: "Yazar ne istiyor?"

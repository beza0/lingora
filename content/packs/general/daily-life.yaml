id: general-daily-life
domain: general
title: "Günlük yaşam ve planlar"
desc: "Günlük rutin, hafta sonu planları, davet etme, kabul etme ve erteleme."
sort: 2

targets:
  - id: usually
    w: usually
    pos: adv
    tr: "genellikle"
    ex: "I [[usually]] get up at seven."
    extr: "Genellikle yedide kalkarım."
    d: 1
    syn: ["normally", "generally"]
    tone: ["Günlük"]
    dis:
      - "unusually | “Alışılmadık şekilde” demektir."
      - "usual | Sıfattır; burada zarf gerekir."
      - "useful | Yararlı demektir."
  - id: commute
    w: commute
    pos: v
    tr: "işe gidip gelmek"
    ex: "I [[commute]] to work by metro."
    extr: "İşe metroyla gidip geliyorum."
    d: 2
    col: ["daily commute", "a long commute"]
    fam: ["commute (i.) işe gidip gelme yolculuğu", "commuter (i.) işe gidip gelen kişi"]
    tone: ["Günlük"]
    dis:
      - "compute | Hesaplamak demektir."
      - "commit | Bağlanmak veya suç işlemek demektir."
      - "comment | Yorum yapmak demektir."
  - id: errand
    w: errand
    pos: n
    tr: "ayak işi (alışveriş, fatura, kargo gibi)"
    ex: "I have a few [[errands]] to run this afternoon."
    extr: "Bu öğleden sonra halletmem gereken birkaç ayak işim var."
    d: 3
    col: ["run errands", "a quick errand"]
    tone: ["Günlük"]
    dis:
      - "errors | Hata demektir."
      - "arrows | Ok demektir."
      - "erasers | Silgi demektir."
  - id: grocery
    w: grocery
    pos: n
    tr: "market (gıda) alışverişi"
    ex: "I do the [[grocery]] shopping on Saturdays."
    extr: "Market alışverişini cumartesileri yaparım."
    d: 2
    col: ["grocery store", "groceries"]
    tone: ["Günlük"]
    dis:
      - "gallery | Galeri demektir."
      - "greenery | Yeşillik demektir."
      - "grocer | Bakkal (kişi) demektir; “grocer shopping” denmez."
  - id: appointment
    w: appointment
    pos: n
    tr: "randevu"
    ex: "I have a dentist [[appointment]] on Friday."
    extr: "Cuma günü dişçi randevum var."
    d: 2
    col: ["make an appointment", "cancel an appointment"]
    tone: ["Günlük", "Resmî"]
    dis:
      - "apartment | Daire demektir."
      - "appointee | Bir göreve atanan kişi demektir."
      - "disappointment | Hayal kırıklığı demektir."
  - id: free
    w: free
    pos: adj
    tr: "boş, müsait"

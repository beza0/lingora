patterns:
  - id: going-to-weekend
    t: "I'm going to … this weekend."
    ex: "I'm [[going to]] visit my parents this weekend."
    extr: "Bu hafta sonu ailemi ziyaret edeceğim."
    ttr: "Bu hafta sonu şunu yapacağım: …."
    slots: ["visit my parents | ailemi ziyaret etmek", "clean the house | evi temizlemek", "watch a movie | film izlemek"]
    chunks: ["I'm going to | -eceğim (plan)", "visit my parents | eylem", "this weekend | bu hafta sonu"]
    g: going-to-plans
    ctx: ["Sohbet", "Plan yapma"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "going | Fiile bağlamak için “to” gerekir."
      - "go to | “I'm” sonrası -ing gerekir."
      - "gone to | “Gitti” anlamına gelir."
    alt: ["I am going to visit my parents this weekend."]
  - id: how-about
    t: "How about …?"
    ex: "How [[about]] going to the cinema tonight?"
    extr: "Bu akşam sinemaya gitmeye ne dersin?"
    ttr: "Şuna ne dersin: …?"
    slots: ["going to the cinema tonight | bu akşam sinemaya gitmek", "meeting at six | altıda buluşmak", "a picnic on Sunday | pazar günü piknik"]
    chunks: ["How about | ne dersin", "going to the cinema | öneri (-ing veya isim)"]
    g: modal-suggestions-should
    ctx: ["Plan yapma", "Davet"]
    tone: ["Samimi"]
    d: 1
    dis:
      - "for | Kalıp “How about” biçimindedir."
      - "with | Kalıp “How about” biçimindedir."
      - "of | Kalıp “How about” biçimindedir."
  - id: are-you-free
    t: "Are you free on …?"
    ex: "Are you free [[on]] Friday evening?"
    extr: "Cuma akşamı müsait misin?"
    ttr: "… müsait misin?"
    slots: ["Friday evening | cuma akşamı", "the 15th | ayın 15'inde", "Sunday morning | pazar sabahı"]
    chunks: ["Are you free | müsait misin", "on Friday evening | zaman"]
    g: to-be
    ctx: ["Plan yapma", "Davet"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "in | Gün ve tarihlerden önce “on” gelir."
      - "at | Saatlerden önce “at” gelir."
      - "by | “by” bir zamana kadar demektir."
  - id: always-before
    t: "I always … before …"
    ex: "I always check my email [[before]] work."
    extr: "İşten önce her zaman e-postalarımı kontrol ederim."
    ttr: "İşten önce her zaman şunu yaparım: …."
    slots: ["check my email | e-postalarımı kontrol etmek", "have a coffee | kahve içmek", "go for a run | koşuya çıkmak"]
    chunks: ["I always | her zaman", "check my email | eylem", "before work | işten önce"]
    g: frequency-adverbs
    ctx: ["Sohbet", "Rutin"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "ago | Geçmiş zaman ifadesidir; isimden önce gelmez."
      - "since | Present perfect ile kullanılır."
      - "beforehand | Zarftır; ardından isim gelmez."
  - id: have-to
    t: "I have to … today."
    ex: "I [[have to]] finish this report today."
    extr: "Bu raporu bugün bitirmem gerekiyor."
    ttr: "Bugün şunu yapmam gerekiyor: …."
    slots: ["finish this report | bu raporu bitirmek", "pick up my kids at four | dörtte çocuklarımı almak", "pay the bills | faturaları ödemek"]
    chunks: ["I have to | -mem gerekiyor", "finish this report | yapılacak iş", "today | bugün"]
    g: can-have-to
    ctx: ["Sohbet", "Mazeret"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "has to | “I” ile “have to” kullanılır."
      - "have | Zorunluluk için “to” gerekir."
      - "must to | “must” sonrası “to” gelmez."
  - id: meeting-tomorrow
    t: "I'm meeting … tomorrow."
    ex: "I'm [[meeting]] Ayşe for lunch tomorrow."
    extr: "Yarın öğle yemeğinde Ayşe'yle buluşacağım."
    ttr: "Yarın … buluşacağım."
    slots: ["Ayşe for lunch | öğle yemeğinde Ayşe'yle", "my brother at the station | istasyonda kardeşimle", "a client at ten | saat onda bir müşteriyle"]
    chunks: ["I'm meeting | buluşacağım (ayarlanmış plan)", "Ayşe for lunch | kim ve ne için", "tomorrow | yarın"]
    g: present-continuous
    ctx: ["Plan yapma"]
    tone: ["Günlük"]
    d: 2
    dis:
      - "meet | “I'm” sonrası -ing gerekir."
      - "met | Geçmiş hâl “I'm” ve “tomorrow” ile kullanılmaz."
      - "meat | “meat” et demektir."
  - id: lets-meet
    t: "Let's meet at …"
    ex: "Let's [[meet]] at the café near the station."
    extr: "İstasyonun yakınındaki kafede buluşalım."
    ttr: "Şurada buluşalım: …."
    slots: ["the café near the station | istasyonun yakınındaki kafe", "the main entrance | ana giriş", "my place | benim ev"]
    chunks: ["Let's | -elim", "meet | buluş-", "at the café | yer"]
    g: present-simple
    ctx: ["Plan yapma"]
    tone: ["Samimi"]
    d: 1
    dis:
      - "meeting | “Let's” sonrası fiil yalın olur."
      - "to meet | “Let's” sonrası “to” gelmez."
      - "met | “Let's” sonrası geçmiş hâl gelmez."
  - id: it-takes
    t: "It takes … to get to …"
    ex: "It [[takes]] about 40 minutes to get to work."
    extr: "İşe gitmek yaklaşık 40 dakika sürüyor."
    ttr: "İşe gitmek şu kadar sürüyor: …."
    slots: ["about 40 minutes | yaklaşık 40 dakika", "an hour by bus | otobüsle bir saat", "ten minutes on foot | yürüyerek on dakika"]
    chunks: ["It takes | sürüyor", "about 40 minutes | süre", "to get to work | işe gitmek"]
    g: present-simple
    ctx: ["Sohbet", "Rutin"]
    tone: ["Günlük"]
    d: 2
    dis:
      - "lasts | Yolculuk süresi için “It takes … to” kalıbı kullanılır."
      - "spends | “spend” kişinin zaman harcamasıdır; özne “it” olamaz."
      - "take | Tekil özne “it” ile -s gerekir."
  - id: cant-make-it
    t: "Sorry, I can't make it …"
    ex: "Sorry, I can't [[make it]] tonight."
    extr: "Kusura bakma, bu akşam gelemiyorum."
    ttr: "Kusura bakma, şu zaman gelemiyorum: …."
    slots: ["tonight | bu akşam", "on Thursday | perşembe", "this weekend | bu hafta sonu"]
    chunks: ["Sorry | kusura bakma", "I can't make it | gelemiyorum, yetişemiyorum", "tonight | zaman"]
    g: can-have-to
    ctx: ["Davet", "Mazeret"]
    tone: ["Nazik"]
    d: 2
    dis:
      - "make up | “Telafi etmek” veya “barışmak” demektir."
      - "makes it | “can't” sonrası fiil yalın olur."
      - "make them | Anlamsız bir yapıdır."
  - id: what-time-start
    t: "What time does … start?"
    ex: "What time [[does]] the movie start?"
    extr: "Film saat kaçta başlıyor?"
    ttr: "… saat kaçta başlıyor?"
    slots: ["the movie | film", "your shift | vardiyan", "the class | ders"]
    chunks: ["What time | saat kaçta", "does the movie start | film başlıyor"]
    g: present-simple
    ctx: ["Plan yapma"]
    tone: ["Günlük"]
    d: 1
    dis:
      - "do | Tekil özne (the movie) ile “does” gerekir."
      - "is | Fiil cümlesinde soru “does” ile kurulur."
      - "doing | Soru yardımcı fiili gerekir."

grammar:
  - id: going-to-plans
    title: "be going to ve will ile gelecek"
    short: "Önceden karar verilmiş planlar için am/is/are going to + yalın fiil: I'm going to visit my parents. Konuşma anında verilen kararlar ve sözler için will: I'll call you later."
    long: "Ayarlanmış buluşmalar için present continuous da kullanılır: I'm meeting Ayşe tomorrow. Olumsuz: I'm not going to … / I won't … Konuşmada going to çoğu zaman “gonna” diye söylenir ama resmî yazıda kullanılmaz. will kısaltmaları: I'll, you'll, we'll."
    ex: ["I'm going to clean the house on Saturday. | Cumartesi evi temizleyeceğim.", "I'll send you the address. | Sana adresi göndereceğim.", "We're meeting at six. | Altıda buluşuyoruz."]
  - id: frequency-adverbs
    title: "Sıklık zarfları"
    short: "always, usually, often, sometimes, rarely, never ne sıklıkla yaptığını anlatır ve genelde ana fiilden önce gelir: I usually walk to work."
    long: "be fiilinden sonra gelir: I'm always tired on Mondays. Sıklık sorusu: How often do you …? Cevaplar: once a week, twice a month, every day (genelde cümle sonunda). never zaten olumsuzdur; “don't never” denmez."
    ex: ["I usually have breakfast at eight. | Genellikle sekizde kahvaltı yaparım.", "She is never late. | O asla geç kalmaz.", "How often do you go to the gym? | Spor salonuna ne sıklıkla gidersin?"]

scenarios:
  - id: weekend-plans
    title: "Hafta sonu planı"
    sit: "Bir arkadaşın seni cumartesi müzedeki yeni sergiye çağırıyor."
    d: 1
    targets: [free, sounds-good, how-about]
    turns:
      - ["Zeynep", "Are you free on Saturday? There's a new exhibition at the museum.", "Cumartesi müsait misin? Müzede yeni bir sergi var."]
      - choose:
          - ["Yes, I'm free in the afternoon. How about meeting at two?", true, "Müsaitliğini söyleyip somut bir saat öneriyor."]
          - ["Yes, I'm fee in the afternoon.", false, "“fee” ücret demektir."]
          - ["Yes, I'm going to free on Saturday.", false, "“going to” sonrası fiil gerekir; doğrusu “I'm free”."]
      - ["Zeynep", "Two o'clock works for me. Let's meet at the main entrance.", "Saat iki bana uyar. Ana girişte buluşalım."]
      - choose:
          - ["Sounds good! See you on Saturday.", true, "Kabul ediyor ve doğal biçimde vedalaşıyor."]
          - ["Sounds goods! See you on Saturday.", false, "“goods” mal, eşya demektir."]
          - ["Sound good, see you yesterday.", false, "“Sounds” gerekir; “yesterday” ise anlamsız."]
  - id: cancel-dinner
    title: "Yemeği erteleme"
    sit: "Bu akşamki yemeğe gidemeyeceksin. Arkadaşına nazikçe haber veriyorsun."
    d: 2
    targets: [afraid-cant, postpone, have-to]
    turns:
      - ["Kerem", "We're still meeting for dinner tonight, right?", "Bu akşam yemekte buluşuyoruz, değil mi?"]
      - choose:
          - ["I'm afraid I can't. I have to work late. Can we postpone it until Friday?", true, "Nazikçe reddediyor, nedenini söylüyor ve yeni bir zaman öneriyor."]
          - ["I'm afraid I can. I have to work late.", false, "Olumlu cevap ardından gelen mazeretle çelişiyor."]
          - ["I'm afraid of I can't, I postpone Friday.", false, "“of” fazla ve cümle bozuk."]
      - ["Kerem", "No problem. Friday works for me.", "Sorun değil. Cuma bana uyar."]
      - choose:
          - ["Great, thanks for understanding!", true, "Anlayış gösterdiği için teşekkür ediyor."]
          - ["Great, thanks for understand!", false, "“for” sonrası -ing gerekir: understanding."]
          - ["Great, I cancel Friday too.", false, "Az önce önerdiği günü iptal ediyor; anlamsız."]

readings:
  - id: typical-week
    title: "My typical week"
    kind: "Kişisel blog"
    d: 2
    s:
      - ["On weekdays, I usually get up at 6:30 and commute to work by ferry.", "Hafta içi genellikle 6.30'da kalkarım ve işe vapurla gidip gelirim."]
      - ["The ferry takes about 25 minutes, so I read a book on the way.", "Vapur yaklaşık 25 dakika sürüyor, bu yüzden yolda kitap okurum."]
      - ["I always avoid the roads during rush hour.", "Yoğun saatlerde yollardan hep uzak dururum."]
      - ["On Saturdays, I do the laundry and the grocery shopping.", "Cumartesileri çamaşır yıkar ve market alışverişi yaparım."]
      - ["Sundays are for my family, and sometimes I take a nap after lunch.", "Pazarlar ailem içindir ve bazen öğle yemeğinden sonra kısa bir uyku çekerim."]
    gloss: ["commute | işe gidip gelmek", "rush hour | yoğun saat", "laundry | çamaşır", "take a nap | kısa uyku çekmek"]
    q:
      - q: "Yazar işe nasıl gidip geliyor?"
        o: ["Metroyla", "Vapurla", "Arabayla"]
        a: 1
        why: "“commute to work by ferry”"

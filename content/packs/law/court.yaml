patterns:
  - id: we-intend-to
    t: "We intend to … on behalf of our client."
    ex: "We [[intend to]] file a claim on behalf of our client."
    extr: "Müvekkilimiz adına bir talepte bulunmayı düşünüyoruz."
    ttr: "Müvekkilimiz adına … düşünüyoruz."
    slots: ["file a claim | talepte bulunmayı", "appeal the decision | karara itiraz etmeyi", "settle the dispute | uyuşmazlığı sulhen çözmeyi"]
    chunks: ["We intend to | -meyi düşünüyoruz", "on behalf of our client | müvekkilimiz adına"]
    g: legal-modals
    ctx: ["Hukuki yazışma"]
    tone: ["Resmî"]
    d: 3
    dis:
      - "intend filing | “intend” genellikle “to + fiil” alır."
      - "attend to | “attend” katılmak demektir."
      - "intent to | İsim; fiil “intend” gerekir."
  - id: the-hearing-has-been
    t: "The hearing has been … to …"
    ex: "The hearing has been [[postponed]] to 3 June."
    extr: "Duruşma 3 Haziran'a ertelendi."
    ttr: "Duruşma 3 Haziran'a …"
    slots: ["postponed | ertelendi.", "moved | alındı.", "rescheduled | yeniden planlandı."]
    chunks: ["The hearing | duruşma", "has been postponed | ertelendi", "to 3 June | 3 Haziran'a"]
    g: past-passive
    ctx: ["Dava süreci"]
    tone: ["Resmî"]
    d: 3
    dis:
      - "has postponed | Edilgen anlam için “has been postponed”."
      - "is postpone | Üçüncü hâl gerekir."
      - "has been postpone | Üçüncü hâl gerekir: postponed."
  - id: according-to-the-witness
    t: "According to the …, …"
    ex: "According to the [[witness]], the car was going too fast."
    extr: "Tanığa göre araba çok hızlı gidiyordu."
    ttr: "…, araba çok hızlı gidiyordu."
    slots: ["witness | Tanığa göre", "police report | Polis raporuna göre", "expert | Bilirkişiye göre"]
    chunks: ["According to | -e göre", "the witness | tanık"]
    g: reporting-verbs
    ctx: ["Dava süreci"]
    tone: ["Resmî", "Nesnel"]
    d: 2
    dis:
      - "According the | “to” eksik."
      - "Accordingly to | “accordingly” bu nedenle demektir."
      - "According with | Edat “to” olmalı."
  - id: my-client-denies
    t: "My client denies …"
    ex: "My client [[denies]] any wrongdoing."
    extr: "Müvekkilim herhangi bir yanlış yaptığını reddediyor."
    ttr: "Müvekkilim … reddediyor."
    slots: ["any wrongdoing | herhangi bir yanlış yaptığını", "the allegations | iddiaları", "breaching the contract | sözleşmeyi ihlal ettiğini"]
    chunks: ["My client | müvekkilim", "denies | reddediyor", "any wrongdoing | herhangi bir kusuru"]
    g: reporting-verbs
    ctx: ["Dava süreci"]
    tone: ["Resmî"]
    d: 3
    dis:
      - "refuses | “refuse” bir şeyi yapmayı reddetmek demektir; iddiayı inkâr için “deny”."
      - "denys | Yazım: denies."
      - "rejects to | Yapı yanlış."
  - id: the-court-ruled-that
    t: "The court ruled that …"
    ex: "The court [[ruled that]] the contract was void."
    extr: "Mahkeme sözleşmenin geçersiz olduğuna karar verdi."
    ttr: "Mahkeme … karar verdi."
    slots: ["the contract was void | sözleşmenin geçersiz olduğuna", "the employer must pay damages | işverenin tazminat ödemesi gerektiğine", "the claim was time-barred | talebin zamanaşımına uğradığına"]
    chunks: ["The court ruled | mahkeme karar verdi", "that … | …-dığına"]
    g: reporting-verbs
    ctx: ["Karar"]
    tone: ["Resmî"]

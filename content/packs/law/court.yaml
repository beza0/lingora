grammar:
  - id: court-passive-reporting
    title: "Mahkeme dili: edilgen yapı ve aktarma fiilleri"
    short: "Mahkeme sürecini anlatırken edilgen (was adjourned, was found guilty) ve aktarma fiilleri (ruled that, claimed that, denied …) sık kullanılır."
    long: "Edilgen: The hearing was adjourned (duruşma ertelendi). He was found guilty (suçlu bulundu). The case was dismissed (dava reddedildi). Aktarma: The court ruled that … (mahkeme … karar verdi), The plaintiff claims that … (davacı … iddia ediyor), The defendant denied the allegations (davalı iddiaları reddetti). deny sonrası isim ya da -ing gelir: denied breaching the contract."
    ex: ["The case was dismissed. | Dava reddedildi.", "The plaintiff claims that the goods were damaged. | Davacı malların hasarlı olduğunu iddia ediyor.", "The defendant denied breaching the contract. | Davalı sözleşmeyi ihlal ettiğini reddetti."]
  - id: formal-advice-requirements
    title: "Resmî tavsiye ve zorunluluk: must, are required to, we would advise"
    short: "Avukat yazışmasında zorunluluk “must / are required to”, tavsiye “we would advise you to / it is advisable to” ile verilir."
    long: "Zorunluluk: You must file the appeal within 14 days. You are required to attend the hearing. Tavsiye: We would advise you to keep copies of all documents. It is advisable to seek legal advice. Olasılık: The court may ask for further evidence. Yumuşak dil: We would be grateful if you could send …"
    ex: ["You are required to attend the hearing in person. | Duruşmaya bizzat katılmanız gerekmektedir.", "We would advise you not to sign the agreement yet. | Sözleşmeyi henüz imzalamamanızı tavsiye ederiz.", "The court may ask for further evidence. | Mahkeme ek delil isteyebilir."]

scenarios:
  - id: client-meeting
    title: "Müvekkille ilk görüşme"
    sit: "Bir hukuk bürosunda stajyersin. Yabancı bir müvekkil, eski işvereninin maaşını ödemediğini söylüyor."
    d: 3
    targets: [dispute, lawsuit, statement]
    turns:
      - ["Client", "My former employer hasn't paid my last two salaries. What can I do?", "Eski işverenim son iki maaşımı ödemedi. Ne yapabilirim?"]
      - choose:
          - ["I'm sorry to hear that. Do you have your employment contract and payslips?", true, "Empati kurup gerekli belgeleri soruyor."]
          - ["You must sue them tomorrow.", false, "Bilgi almadan kesin tavsiye vermek uygun değil."]
          - ["Why you didn't ask money?", false, "Soru yapısı bozuk ve suçlayıcı."]
      - ["Client", "Yes, I have both. Should I go to court?", "Evet, ikisi de var. Mahkemeye gitmeli miyim?"]
      - choose:
          - ["First we would advise you to send a formal letter. If they don't pay, we can file a lawsuit.", true, "Aşamalı ve resmî bir tavsiye veriyor."]
          - ["Yes, court is always the best.", false, "Kesin ve gerçekçi olmayan bir yargı."]
          - ["We would advice you to wait.", false, "“advice” isimdir; fiil “advise” olmalı."]
      - ["Client", "That sounds sensible. How long do I have to file a claim?", "Mantıklı görünüyor. Talep için ne kadar sürem var?"]
  - id: hearing-update
    title: "Duruşma ertelendi"
    sit: "Yabancı müvekkile telefonda duruşmanın ertelendiğini haber veriyorsun."
    d: 3
    targets: [hearing, adjourned, witness]
    turns:
      - ["Client", "Hello, is everything ready for tomorrow's hearing?", "Merhaba, yarınki duruşma için her şey hazır mı?"]
      - choose:
          - ["I'm afraid the hearing has been adjourned until 3 June.", true, "Kötü haberi kibarca ve doğru edilgen yapıyla veriyor."]
          - ["The hearing adjourned you.", false, "Anlamsız bir cümle."]
          - ["Tomorrow is cancel.", false, "Eksik ve yanlış yapı."]
      - ["Client", "Oh no. Why?", "Olamaz. Neden?"]
      - choose:
          - ["One of the witnesses is ill and can't attend.", true, "Gerekçeyi açık ve doğru anlatıyor."]
          - ["Because witness sick.", false, "Fiil ve tanımlık eksik."]
          - ["I don't know, the judge is lazy.", false, "Profesyonel olmayan bir açıklama."]
      - ["Client", "I see. Do I need to do anything before then?", "Anlıyorum. O zamana kadar bir şey yapmam gerekiyor mu?"]

readings:
  - id: court-notice
    title: "Notice of hearing"
    kind: "Duruşma tebligatı"
    d: 3
    s:
      - ["You are hereby notified that a hearing will take place on 14 March at 10:00.", "14 Mart saat 10.00'da bir duruşma yapılacağı işbu yazıyla tarafınıza bildirilir."]
      - ["The hearing will be held at Court Room 3, Istanbul Commercial Court.", "Duruşma İstanbul Ticaret Mahkemesi 3 No'lu Salonda yapılacaktır."]
      - ["You are required to attend in person or be represented by a lawyer.", "Bizzat katılmanız veya bir avukat tarafından temsil edilmeniz gerekmektedir."]
      - ["Any written evidence must be submitted no later than seven days before the hearing.", "Yazılı deliller duruşmadan en geç yedi gün önce sunulmalıdır."]
      - ["If you fail to attend, the court may decide the case in your absence.", "Katılmamanız hâlinde mahkeme davayı yokluğunuzda karara bağlayabilir."]
    gloss: ["hereby notified | işbu yazıyla bildirilir", "in person | bizzat", "be represented by | tarafından temsil edilmek", "in your absence | yokluğunuzda"]
    q:
      - q: "Yazılı deliller en geç ne zaman sunulmalı?"
        o: ["Duruşma günü", "Duruşmadan yedi gün önce", "Duruşmadan bir gün sonra"]
        a: 1
        why: "“no later than seven days before the hearing”"
      - q: "Katılım olmazsa ne olabilir?"
        o: ["Duruşma iptal edilir", "Dava yokluğunda karara bağlanabilir", "Ceza ödenir"]
        a: 1
        why: "“the court may decide the case in your absence”"
  - id: case-summary
    title: "Case summary"
    kind: "Dava özeti"
    d: 3
    s:
      - ["The plaintiff, a software company, claims that the defendant failed to pay for services delivered in 2025.", "Davacı bir yazılım şirketi, davalının 2025'te verilen hizmetlerin bedelini ödemediğini iddia ediyor."]
      - ["The defendant denies the allegation and argues that the software did not work as agreed.", "Davalı iddiayı reddediyor ve yazılımın kararlaştırıldığı gibi çalışmadığını ileri sürüyor."]
      - ["An expert witness examined the system and found several serious defects.", "Bir bilirkişi sistemi inceledi ve birkaç ciddi kusur buldu."]
      - ["The court ruled that the defendant must pay half of the invoice.", "Mahkeme davalının faturanın yarısını ödemesi gerektiğine karar verdi."]
      - ["Both parties have 14 days to appeal against the ruling.", "Her iki tarafın da karara itiraz etmek için 14 günü var."]
    gloss: ["services delivered | verilen hizmetler", "argue | ileri sürmek", "defect | kusur", "appeal against | -e itiraz etmek"]
    q:
      - q: "Davalı neden ödeme yapmadığını söylüyor?"
        o: ["Fatura hiç gelmediği için", "Yazılım kararlaştırıldığı gibi çalışmadığı için", "Şirket iflas ettiği için"]
        a: 1
        why: "“argues that the software did not work as agreed”"
      - q: "Mahkeme ne karar verdi?"
        o: ["Davalı faturanın tamamını ödeyecek", "Davalı faturanın yarısını ödeyecek", "Dava reddedildi"]
        a: 1
        why: "“the defendant must pay half of the invoice”"

writing:
  id: client-update-email
  p: "Yabancı bir müvekkile 3–4 cümlelik resmî bir e-posta yaz: duruşmanın ertelendiğini bildir, yeni tarihi ver ve ondan istenen bir belgeyi belirt."
  rubric: ["Resmî açılış ve kapanış var (Dear …, Kind regards)", "Edilgen yapı doğru kullanılmış (has been adjourned / postponed)", "İstenen işlem açık ve kibar (You are required to … / We would be grateful if …)"]
  samples: ["Dear Mr Smith, I am writing to inform you that the hearing has been adjourned until 3 June at 10:00. One of the witnesses is unable to attend on the original date. We would be grateful if you could send us a copy of your employment contract by 20 May. Kind regards, Selin Demir"]
  d: 3


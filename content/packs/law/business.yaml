    w: employment contract
    pos: n
    tr: "iş sözleşmesi"
    ex: "Your [[employment contract]] states a notice period of one month."
    extr: "İş sözleşmeniz bir aylık ihbar süresi öngörüyor."
    d: 2
    col: ["sign an employment contract", "fixed-term contract", "permanent contract"]
    tone: ["Hukuk", "İş"]
    dis:
      - "employer contract | Doğal değil; “employment contract” kullanılır."
      - "employee contact | “contact” iletişim demektir."
      - "employment contrast | “contrast” karşıtlık demektir."
  - id: notice-period
    w: notice period
    pos: n
    tr: "ihbar süresi"

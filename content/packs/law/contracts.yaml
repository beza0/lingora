id: law-contracts
domain: law
title: "Sözleşme dili ve hukuki yazışma"
desc: "Taraflar, yükümlülükler, fesih, süre ve hukuki e-postalarda kullanılan temel İngilizce."
sort: 1

targets:
  - id: contract
    w: contract
    pos: n
    tr: "sözleşme"
    ex: "Both parties signed the [[contract]] on 1 March."
    extr: "Her iki taraf da sözleşmeyi 1 Mart'ta imzaladı."
    d: 1
    col: ["sign a contract", "breach of contract", "employment contract"]
    syn: ["agreement"]
    fam: ["contractual (s.) sözleşmeye dayalı", "contractor (i.) yüklenici"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "contact | İletişim demektir."
      - "contrast | Karşıtlık demektir."
      - "contest | Yarışma demektir."
  - id: party
    w: party
    pos: n
    tr: "taraf (sözleşmede)"
    ex: "Each [[party]] must give 30 days' written notice."
    extr: "Her taraf 30 gün önceden yazılı bildirimde bulunmalıdır."
    d: 2
    col: ["both parties", "third party", "the parties agree"]
    other: "Günlük dilde “parti, eğlence” demektir."
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "part | Parça, bölüm demektir."
      - "partner | Ortak demektir; sözleşmenin tarafı için genel terim “party”."
      - "person | Kişi demektir; hukuki taraf için “party” kullanılır."
  - id: clause
    w: clause
    pos: n
    tr: "madde, hüküm (sözleşmede)"
    ex: "Please read [[clause]] 7 on confidentiality carefully."
    extr: "Lütfen gizlilikle ilgili 7. maddeyi dikkatle okuyun."
    d: 2
    col: ["termination clause", "penalty clause", "under clause 5"]
    syn: ["provision"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "cause | Neden demektir."
      - "close | Kapatmak demektir."
      - "claws | Pençeler demektir."
  - id: terminate
    w: terminate
    pos: v
    tr: "feshetmek, sona erdirmek"
    ex: "Either party may [[terminate]] this agreement with 30 days' notice."
    extr: "Taraflardan her biri bu sözleşmeyi 30 gün önceden bildirimle feshedebilir."
    d: 3
    col: ["terminate a contract", "terminate early"]
    fam: ["termination (i.) fesih"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "determine | Belirlemek demektir."
      - "terminal | Terminal, son nokta demektir; isim veya sıfattır."
      - "nominate | Aday göstermek demektir."
  - id: breach
    w: breach
    pos: n
    tr: "ihlal (sözleşme ihlali)"
    ex: "Late payment is a [[breach]] of the agreement."
    extr: "Geç ödeme, sözleşmenin ihlalidir."
    d: 3
    col: ["breach of contract", "material breach", "in breach of"]
    syn: ["violation"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "beach | Plaj demektir."
      - "branch | Şube demektir."
      - "speech | Konuşma demektir."
  - id: liable
    w: liable
    pos: adj
    tr: "(hukuken) sorumlu"
    ex: "The supplier is [[liable]] for any damage during delivery."
    extr: "Tedarikçi, teslimat sırasındaki her türlü hasardan sorumludur."
    d: 3
    col: ["liable for", "held liable"]
    fam: ["liability (i.) sorumluluk, yükümlülük"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "reliable | Güvenilir demektir."
      - "likely | Muhtemel demektir."
      - "livable | Yaşanabilir demektir."
  - id: obligation
    w: obligation
    pos: n
    tr: "yükümlülük"
    ex: "The tenant has an [[obligation]] to keep the property clean."
    extr: "Kiracının mülkü temiz tutma yükümlülüğü vardır."
    d: 2
    col: ["legal obligation", "fulfil an obligation"]
    fam: ["oblige (f.) zorunlu kılmak", "obligatory (s.) zorunlu"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "observation | Gözlem demektir."
      - "operation | İşlem, ameliyat demektir."
      - "obligatory | Sıfattır; burada isim gerekir."
  - id: comply
    w: comply
    pos: v
    tr: "uymak (kurala, yasaya)"
    ex: "All employees must [[comply]] with the data protection rules."
    extr: "Tüm çalışanlar veri koruma kurallarına uymalıdır."
    d: 3
    col: ["comply with the law", "fail to comply"]
    fam: ["compliance (i.) uyum", "compliant (s.) uygun"]
    tone: ["Uyum", "Resmî"]
    dis:
      - "complain | Şikâyet etmek demektir."
      - "complete | Tamamlamak demektir."
      - "compile | Derlemek demektir."
  - id: confidential
    w: confidential
    pos: adj
    tr: "gizli, mahrem"
    ex: "This information is strictly [[confidential]]."
    extr: "Bu bilgi kesinlikle gizlidir."
    d: 2
    col: ["strictly confidential", "confidential information"]
    fam: ["confidentiality (i.) gizlilik"]
    conf: ["confident | Kendinden emin demektir."]
    tone: ["Sözleşme", "E-posta"]
    dis:
      - "confident | Kendinden emin demektir."
      - "conditional | Koşullu demektir."
      - "coincidental | Tesadüfi demektir."
  - id: valid
    w: valid
    pos: adj
    tr: "geçerli"
    ex: "The contract is [[valid]] for two years."
    extr: "Sözleşme iki yıl geçerlidir."
    d: 1
    ant: ["invalid", "void"]
    fam: ["validity (i.) geçerlilik"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "solid | Sağlam demektir."
      - "vivid | Canlı demektir."
      - "valued | Değer verilen demektir."
  - id: deadline-legal
    w: deadline
    pos: n
    tr: "son tarih"
    ex: "The [[deadline]] for filing the appeal is 15 May."
    extr: "İtiraz için başvuru son tarihi 15 Mayıs."
    d: 1
    col: ["meet a deadline", "miss a deadline", "extend the deadline"]
    tone: ["E-posta", "Resmî"]
    dis:
      - "headline | Manşet demektir."
      - "dead end | Çıkmaz demektir."
      - "guideline | Yönerge demektir."
  - id: amend
    w: amend
    pos: v
    tr: "değiştirmek, tadil etmek"
    ex: "We would like to [[amend]] the payment terms."
    extr: "Ödeme koşullarını değiştirmek istiyoruz."
    d: 3
    col: ["amend a contract", "as amended"]
    fam: ["amendment (i.) değişiklik"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "attend | Katılmak demektir."
      - "mend | Tamir etmek demektir; belge için “amend” kullanılır."
      - "append | Eklemek demektir."
  - id: terms-and-conditions
    w: terms and conditions
    pos: phrase
    tr: "şartlar ve koşullar"
    ex: "Please accept the [[terms and conditions]] before you continue."
    extr: "Devam etmeden önce lütfen şartları ve koşulları kabul edin."
    d: 2
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "terms and situations | Kalıp “terms and conditions”."
      - "times and conditions | “times” zamanlar demektir."
      - "rules and terms | Kalıplaşmış ifade değil."
  - id: lawyer
    w: lawyer
    pos: n
    tr: "avukat"
    ex: "You should ask a [[lawyer]] before you sign."
    extr: "İmzalamadan önce bir avukata danışmalısınız."
    d: 1
    syn: ["attorney", "solicitor"]
    tone: ["Günlük", "Resmî"]
    dis:
      - "layer | Katman demektir."
      - "player | Oyuncu demektir."
      - "lower | Daha alçak demektir."
  - id: evidence-legal
    w: evidence
    pos: n
    tr: "delil, kanıt"
    ex: "The court found no [[evidence]] of fraud."
    extr: "Mahkeme dolandırıcılığa dair hiçbir delil bulmadı."
    d: 2
    col: ["provide evidence", "evidence of"]
    conf: ["evidences | Sayılamaz bir isimdir; çoğul eki almaz."]
    tone: ["Dava", "Resmî"]
    dis:
      - "evident | Açık, belli demektir (sıfat)."
      - "evidences | Sayılamaz isim; çoğul olmaz."
      - "existence | Varlık demektir."
  - id: in-accordance-with
    w: in accordance with
    pos: phrase
    tr: "… uyarınca, … uygun olarak"
    ex: "Payment will be made [[in accordance with]] clause 4."
    extr: "Ödeme 4. madde uyarınca yapılacaktır."
    d: 3
    syn: ["according to", "under"]
    tone: ["Sözleşme", "Resmî"]
    dis:
      - "in according to | Kalıp “in accordance with”."
      - "in accordance to | Edat yanlış; “with” olmalı."
      - "by accordance with | Edat yanlış."
  - id: on-behalf-of
    w: on behalf of
    pos: phrase
    tr: "… adına"
    ex: "I am writing [[on behalf of]] my client, Mr. Aksoy."
    extr: "Müvekkilim Bay Aksoy adına yazıyorum."
    d: 2
    tone: ["E-posta", "Resmî"]
    dis:
      - "on the behalf from | Edatlar yanlış."
      - "in behalf to | Kalıp “on behalf of”."
      - "instead of | Yerine demektir; temsil anlamı yok."
  - id: notice
    w: notice
    pos: n
    tr: "bildirim, ihbar"
    ex: "You must give two months' [[notice]] before you leave."
    extr: "Ayrılmadan önce iki ay önceden bildirimde bulunmalısınız."
    d: 2
    col: ["written notice", "notice period", "give notice"]
    other: "Fiil olarak “fark etmek” demektir."
    tone: ["Sözleşme", "İş hukuku"]
    dis:
      - "notes | Notlar demektir."
      - "novice | Acemi demektir."
      - "notion | Kavram, fikir demektir."
  - id: hereby
    w: hereby
    pos: adv
    tr: "işbu belge ile, bu yolla"
    ex: "The parties [[hereby]] agree to the following terms."
    extr: "Taraflar işbu belge ile aşağıdaki şartları kabul eder."
    d: 3
    tone: ["Sözleşme", "Çok resmî"]
    dis:
      - "nearby | Yakında demektir."
      - "thereby | Böylece, bunun sonucunda demektir."
      - "whereby | Aracılığıyla, ki bununla demektir."
  - id: without-prejudice

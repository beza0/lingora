writing:
  id: review-comment
  p: "Bir PR'a 2–3 cümlelik nazik bir inceleme yorumu yaz: bir şeyi beğen, bir değişiklik öner ve nedenini söyle."
  rubric: ["Olumlu bir geri bildirimle başlıyor", "Öneriyi “could / maybe / what about” gibi nazik bir kalıpla yapıyor", "Önerinin nedenini açıklıyor"]
  samples: ["Nice work on the search filters! One suggestion: the API URL is hardcoded, so maybe we could read it from the config file. This would make it easier to change per environment."]
  d: 3


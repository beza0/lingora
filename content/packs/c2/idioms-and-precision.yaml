    extr: "O işi kaybetmek aslında hayırlı oldu."
    d: 5
    tone: ["Deyim"]
    dis:
      - "a blessing in costume | Deyim “disguise” ile kurulur."
      - "a curse in disguise | Anlam terse döner."
      - "a blessing on disguise | Edat “in”."
  - id: cut-corners
    w: cut corners
    pos: phrase
    tr: "işi baştan savma yapmak, kestirme yola sapmak"
    ex: "If you [[cut corners]] on safety, someone will get hurt."
    extr: "Güvenlikte kestirmeden gidersen biri zarar görür."
    d: 5
    tone: ["Deyim", "İş"]
    dis:
      - "cut edges | Deyim “corners” ile kurulur."
      - "cut the corner | Deyim çoğul ve tanımlıksız."
      - "turn corners | “Köşeleri dönmek” demektir."
  - id: get-the-hang-of
    w: get the hang of
    pos: phrase
    tr: "-in püf noktasını kavramak, alışmak"

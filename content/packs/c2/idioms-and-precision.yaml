    w: beat around the bush
    pos: phrase
    tr: "lafı dolandırmak"
    ex: "Stop [[beating around the bush]] and tell me what happened."
    extr: "Lafı dolandırmayı bırak da ne olduğunu anlat."
    d: 5
    tone: ["Deyim", "Samimi"]
    dis:
      - "beating around the tree | Deyim “bush” ile kurulur."
      - "hitting around the bush | Deyim “beat” ile kurulur."
      - "beating about the bushes | Deyimde tekil “bush”."
  - id: the-elephant-in-the-room
    w: the elephant in the room
    pos: phrase
    tr: "herkesin bildiği ama konuşmadığı sorun"
    ex: "The budget cut was [[the elephant in the room]] at every meeting."
    extr: "Bütçe kesintisi her toplantıda herkesin bildiği ama konuşmadığı konuydu."
    d: 5
    tone: ["Deyim", "İş"]
    dis:
      - "the elephant in the house | Deyim “room” ile kurulur."
      - "an elephant on the room | Edat ve tanımlık yanlış."
      - "the lion in the room | Deyim “elephant” ile kurulur."
  - id: a-blessing-in-disguise
    w: a blessing in disguise

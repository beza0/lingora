    extr: "İstanbul'da araba kullanmanın püf noktasını kavramam aylar sürdü."
    d: 5
    tone: ["Deyim", "Samimi"]
    dis:
      - "get the hand of | Deyim “hang” ile kurulur."
      - "get the hang on | Edat “of”."
      - "take the hang of | Fiil “get”."
  - id: on-the-fence
    w: on the fence
    pos: phrase
    tr: "kararsız, iki arada"
    ex: "I'm still [[on the fence]] about accepting the offer."
    extr: "Teklifi kabul etme konusunda hâlâ kararsızım."
    d: 5

id: c2-idioms-and-precision
domain: c2
title: "Deyimler ve kesin anlatım"
desc: "Subjunctive (I suggest that he be…), karma if cümleleri, deyimler ve sabit ifadeler; anadil düzeyine yakın doğallık."
sort: 1


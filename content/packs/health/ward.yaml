patterns:
  - id: on-a-scale-of
    t: "On a scale of 0 to 10, how … is it?"
    ex: "On a scale of 0 to 10, how [[bad]] is the pain now?"
    extr: "0'dan 10'a bir ölçekte ağrı şu an ne kadar kötü?"
    ttr: "0'dan 10'a bir ölçekte … ne kadar kötü?"
    slots: ["the pain now | ağrı şu an", "the nausea | bulantı", "the itching | kaşıntı"]
    chunks: ["On a scale of 0 to 10 | 0'dan 10'a bir ölçekte", "how bad | ne kadar kötü"]
    g: ward-questions
    ctx: ["Hastane"]
    tone: ["Soru", "Resmî"]
    d: 2
    dis:
      - "badly | “how” sonrası sıfat gerekir: bad."
      - "worse | Karşılaştırma değil, şiddet soruluyor."
      - "bed | Yatak demektir."
  - id: im-going-to
    t: "I'm just going to … , is that OK?"
    ex: "I'm just going to [[take]] your blood pressure, is that OK?"
    extr: "Şimdi tansiyonunuzu ölçeceğim, olur mu?"
    ttr: "Şimdi …, olur mu?"
    slots: ["take your blood pressure | tansiyonunuzu ölçeceğim", "check your dressing | pansumanınıza bakacağım", "listen to your chest | göğsünüzü dinleyeceğim"]
    chunks: ["I'm just going to | şimdi …-eceğim", "is that OK? | olur mu?"]
    g: ward-questions
    ctx: ["Hastane"]
    tone: ["Kibar"]
    d: 2
    dis:
      - "taking | “going to” sonrası yalın fiil gelir."
      - "took | Geçmiş zaman uygun değil."
      - "takes | “going to” sonrası -s almaz."
  - id: have-you-had-anything
    t: "Have you had anything to … since …?"
    ex: "Have you had anything to [[eat]] since midnight?"
    extr: "Gece yarısından beri bir şey yediniz mi?"

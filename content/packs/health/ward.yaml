      - "eaten | “to” sonrası üçüncü hâl gelmez."
  - id: you-ll-be-able-to
    t: "You'll be able to … after …"
    ex: "You'll be [[able to]] go home after the doctor sees you."
    extr: "Doktor sizi gördükten sonra eve gidebileceksiniz."
    ttr: "Doktor sizi gördükten sonra … -ebileceksiniz."
    slots: ["go home | eve gid", "eat normally | normal yemek yi", "take a shower | duş al"]
    chunks: ["You'll be able to | -ebileceksiniz", "after … | …-den sonra"]

grammar:
  - id: ward-questions
    title: "Hastaya kibar soru: How …? Is there …? When can I …?"
    short: "Serviste sorular kısa ve kibardır. Soru kelimesi + yardımcı fiil + özne sırası kullanılır; “just”, “Is that OK?” yumuşatır."
    long: "Soru sırası: How + sıfat + is it? (How bad is the pain?), When + can + I …? (When can I go home?). Var mı sorusu: Is there anyone who …? / Is there anything …? Yumuşatma: I'm just going to …, is that OK? ve Would you like …? Hastanın sorusunda da aynı sıra korunur: Can I have some water? (I can have değil)."
    ex: ["How bad is the pain now? | Ağrı şu an ne kadar kötü?", "I'm just going to check your drip, is that OK? | Şimdi serumunuza bakacağım, olur mu?", "When can I have something to eat? | Ne zaman bir şey yiyebilirim?"]
  - id: future-plans-hospital
    title: "Planlanan işlemler: will / be going to / be + -ing"
    short: "Kesinleşmiş hastane planları için “be going to” veya “be + -ing”, tahmin ve söz için “will” kullanılır."
    long: "Planlanmış işlem: You're having surgery tomorrow at nine (yarın dokuzda ameliyat oluyorsunuz). Niyet: We're going to take some blood (biraz kan alacağız). Tahmin: You'll feel better in a few days (birkaç güne kendinizi daha iyi hissedeceksiniz). Söz: I'll bring you some water (size su getireceğim). Edilgen gelecek: Your stitches will be removed next week."
    ex: ["You're having an X-ray this afternoon. | Bu öğleden sonra röntgen çektireceksiniz.", "We're going to keep you here tonight. | Bu gece sizi burada tutacağız.", "You'll feel much better tomorrow. | Yarın çok daha iyi hissedeceksiniz."]

scenarios:
  - id: pre-op-check
    title: "Ameliyat öncesi kontrol"
    sit: "Yarın sabah ameliyat olacaksın. Hemşire son kontrolleri yapıyor."
    d: 2
    targets: [nil-by-mouth, consent-form, surgery]
    turns:
      - ["Nurse", "Good evening. You're having your surgery at eight tomorrow. Have you signed the consent form?", "İyi akşamlar. Yarın sekizde ameliyat oluyorsunuz. Onam formunu imzaladınız mı?"]
      - choose:
          - ["Yes, I signed it this afternoon.", true, "Bitmiş bir işi doğru zamanla söylüyor."]
          - ["Yes, I sign it tomorrow.", false, "Zaman uyumsuz; imzalama işi geçmişte olmalı."]
          - ["What is consent?", false, "Formu bilmiyorsa sorabilir ama soru eksik ve kaba."]
      - ["Nurse", "Good. Remember, you're nil by mouth from midnight. Have you had anything to eat since dinner?", "Güzel. Unutmayın, gece yarısından itibaren ağızdan hiçbir şey almıyorsunuz. Akşam yemeğinden beri bir şey yediniz mi?"]
      - choose:
          - ["No, just some water. Is that OK?", true, "Doğru bilgiyi verip uygun olup olmadığını soruyor."]
          - ["No, I don't ate anything.", false, "“don't” sonrası yalın fiil gerekir."]
          - ["I will eat a sandwich at midnight.", false, "Talimata aykırı."]
      - ["Nurse", "Water is fine until midnight. Press the call button if you need anything.", "Gece yarısına kadar su içebilirsiniz. Bir şeye ihtiyacınız olursa çağrı düğmesine basın."]
  - id: discharge-talk
    title: "Taburculuk konuşması"
    sit: "Ameliyattan iki gün sonra taburcu oluyorsun. Hemşire evde dikkat etmen gerekenleri anlatıyor."
    d: 2
    targets: [discharge, wound, stitches]
    turns:
      - ["Nurse", "The doctor says you can be discharged today. Is there anyone who can pick you up?", "Doktor bugün taburcu olabileceğinizi söylüyor. Sizi alabilecek biri var mı?"]
      - choose:
          - ["Yes, my sister is coming at three.", true, "Planlanmış bir olay için “is coming” doğal."]
          - ["Yes, my sister come three o'clock.", false, "Fiil çekimi ve edat eksik."]
          - ["No, I'll drive myself.", false, "Ameliyattan sonra araba kullanmak uygun değil."]
      - ["Nurse", "Great. Keep the wound clean and dry. Your stitches will be removed in ten days.", "Harika. Yarayı temiz ve kuru tutun. Dikişleriniz on gün içinde alınacak."]
      - choose:
          - ["When can I have a shower?", true, "Bakımla ilgili doğru soru yapısı."]
          - ["When I can have shower?", false, "Soru sırası ve tanımlık eksik."]
          - ["Can I swim tomorrow?", false, "Yara kuru tutulmalıyken yüzmek uygun değil."]
      - ["Nurse", "You can shower after 48 hours, but don't soak the wound.", "48 saat sonra duş alabilirsiniz ama yarayı ıslatıp bekletmeyin."]

readings:
  - id: visiting-rules
    title: "Information for visitors"
    kind: "Servis duyurusu"
    d: 2
    s:
      - ["Visiting hours on Ward 4 are from 2 pm to 8 pm every day.", "4. Serviste ziyaret saatleri her gün 14.00–20.00 arasıdır."]
      - ["No more than two visitors are allowed at a bed at one time.", "Bir yatağın yanında aynı anda en fazla iki ziyaretçiye izin verilir."]
      - ["Please clean your hands when you enter and leave the ward.", "Lütfen servise girerken ve çıkarken ellerinizi temizleyin."]
      - ["Do not visit if you have had a cold or stomach bug in the last 48 hours.", "Son 48 saatte soğuk algınlığı veya mide virüsü geçirdiyseniz ziyarete gelmeyin."]
      - ["Flowers are not allowed for infection control reasons.", "Enfeksiyon kontrolü nedeniyle çiçeğe izin verilmez."]
    gloss: ["at one time | aynı anda", "stomach bug | mide virüsü", "infection control | enfeksiyon kontrolü"]
    q:
      - q: "Aynı anda bir yatağı kaç kişi ziyaret edebilir?"
        o: ["Bir", "İki", "Dört"]
        a: 1
        why: "“No more than two visitors are allowed at a bed at one time.”"
      - q: "Çiçek neden yasak?"
        o: ["Yer olmadığı için", "Enfeksiyon kontrolü için", "Alerji yaptığı için"]
        a: 1
        why: "“for infection control reasons”"
  - id: wound-care-sheet
    title: "Caring for your wound at home"
    kind: "Taburcu broşürü"
    d: 2
    s:
      - ["Keep your dressing on for 48 hours after the operation.", "Ameliyattan sonra pansumanınızı 48 saat çıkarmayın."]
      - ["After that, you can shower, but pat the wound dry with a clean towel.", "Sonra duş alabilirsiniz ama yarayı temiz bir havluyla tampon yaparak kurulayın."]
      - ["Some redness and swelling around the wound is normal.", "Yaranın çevresinde biraz kızarıklık ve şişlik olması normaldir."]
      - ["Contact us if the wound becomes hot, very painful or starts to leak.", "Yara ısınır, çok ağrır veya akıntı yapmaya başlarsa bize ulaşın."]
      - ["Your stitches will be removed at your GP practice in 10 to 14 days.", "Dikişleriniz 10–14 gün içinde aile hekiminizde alınacak."]
    gloss: ["dressing | pansuman, yara örtüsü", "pat dry | tampon yaparak kurulamak", "leak | akıntı yapmak", "GP | aile hekimi"]
    q:
      - q: "Pansuman ne kadar süre çıkarılmamalı?"
        o: ["24 saat", "48 saat", "10 gün"]
        a: 1
        why: "“Keep your dressing on for 48 hours”"
      - q: "Hangi durum normal kabul ediliyor?"
        o: ["Yaranın akıntı yapması", "Biraz kızarıklık ve şişlik", "Yaranın ısınması"]
        a: 1
        why: "“Some redness and swelling around the wound is normal.”"

writing:
  id: discharge-message
  p: "Taburcu olduktan sonra servis hemşiresine 3–4 cümlelik bir mesaj yaz: nasıl olduğunu anlat, yaranla ilgili bir soru sor ve kontrol randevusunu teyit et."
  rubric: ["Durumunu anlatmak için uygun zaman kullanılmış (I've been / I feel)", "Yara veya ilaçla ilgili açık bir soru var (Is it normal …? / When can I …?)", "Kibar bir kapanış ve randevu teyidi var"]
  samples: ["Hello, I was discharged from Ward 4 on Monday. I've been feeling much better, but there is some redness around the wound. Is that normal? Could you also confirm that my check-up is on 24 May? Thank you."]
  d: 2


    extr: "Dikişleriniz on gün içinde alınacak."
    d: 2
    col: ["have stitches", "remove the stitches"]
    tone: ["Hastane", "Günlük"]
    dis:
      - "switches | Anahtarlar demektir."
      - "stretches | Esneme hareketleri demektir."
      - "itches | Kaşıntılar demektir."
  - id: wound

id: health-ward
domain: health
title: "Serviste hasta bakımı"
desc: "Yatış, ölçümler, ağrı değerlendirmesi, ameliyat hazırlığı ve taburculuk konuşmaları."
sort: 3

targets:
  - id: admit
    w: admit
    pos: v
    tr: "(hastaneye) yatırmak"
    ex: "We need to [[admit]] you for a few days for observation."
    extr: "Gözlem için sizi birkaç günlüğüne yatırmamız gerekiyor."
    d: 2
    col: ["be admitted to hospital", "admit a patient"]
    fam: ["admission (i.) yatış, kabul"]
    tone: ["Hastane", "Resmî"]
    dis:
      - "admire | Hayran olmak demektir."
      - "adopt | Evlat edinmek ya da benimsemek demektir."
      - "omit | Atlamak, dahil etmemek demektir."
  - id: discharge
    w: discharge
    pos: v
    tr: "taburcu etmek"
    ex: "If your tests are normal, we'll [[discharge]] you tomorrow."
    extr: "Tahlilleriniz normalse sizi yarın taburcu edeceğiz."
    d: 2
    col: ["be discharged", "discharge summary", "discharge from hospital"]
    tone: ["Hastane", "Resmî"]
    dis:
      - "charge | Ücret almak ya da şarj etmek demektir."
      - "disturb | Rahatsız etmek demektir."
      - "dismiss | Görevden almak ya da göndermek demektir."
  - id: ward
    w: ward
    pos: n
    tr: "(hastane) servis(i), koğuş"
    ex: "Visiting hours on this [[ward]] are from two to eight."
    extr: "Bu serviste ziyaret saatleri ikiden sekize kadar."
    d: 2
    col: ["children's ward", "surgical ward", "on the ward"]
    tone: ["Hastane"]
    dis:
      - "word | Kelime demektir."
      - "award | Ödül demektir."
      - "war | Savaş demektir."
  - id: vital-signs
    w: vital signs
    pos: n
    tr: "yaşamsal bulgular (nabız, tansiyon, ateş, solunum)"
    ex: "The nurse checks your [[vital signs]] every four hours."
    extr: "Hemşire yaşamsal bulgularınızı dört saatte bir kontrol ediyor."
    d: 3
    col: ["check vital signs", "stable vital signs"]
    syn: ["vitals"]
    tone: ["Hastane", "Resmî"]
    dis:
      - "vital science | Anlamsız bir ifade."
      - "virtual signs | “virtual” sanal demektir."
      - "visual signs | Görsel işaretler demektir."
  - id: pulse
    w: pulse
    pos: n
    tr: "nabız"
    ex: "Your [[pulse]] is a little fast. Are you feeling anxious?"
    extr: "Nabzınız biraz hızlı. Endişeli mi hissediyorsunuz?"
    d: 1
    col: ["take someone's pulse", "a weak pulse", "pulse rate"]
    syn: ["heart rate"]
    tone: ["Hastane", "Muayene"]
    dis:
      - "pause | Duraklama demektir."
      - "purse | Kadın cüzdanı demektir."
      - "pulse oil | Anlamsız bir ifade."
  - id: drip
    w: drip
    pos: n
    tr: "serum, damar yolu (IV)"
    ex: "You'll be on a [[drip]] until you can eat and drink again."
    extr: "Yeniden yiyip içebilene kadar serumda kalacaksınız."
    d: 2
    col: ["be on a drip", "put up a drip", "IV drip"]
    syn: ["IV"]
    tone: ["Hastane"]
    dis:
      - "trip | Gezi demektir."
      - "grip | Kavramak demektir."
      - "drop | Damla ya da düşmek demektir."
  - id: nil-by-mouth
    w: nil by mouth
    pos: phrase
    tr: "ağızdan hiçbir şey verilmez (aç kalma)"
    ex: "You'll be [[nil by mouth]] from midnight before your operation."
    extr: "Ameliyatınızdan önceki gece yarısından itibaren ağızdan hiçbir şey almayacaksınız."
    d: 3
    col: ["nil by mouth", "no food or drink"]
    syn: ["fasting"]
    tone: ["Hastane", "Resmî"]
    dis:
      - "nothing by hand | Anlamsız bir ifade."
      - "full by mouth | Ters anlam verir."
      - "nil by nose | Kalıp “by mouth” ile kurulur."
  - id: surgery
    w: surgery
    pos: n
    tr: "ameliyat, cerrahi"
    ex: "How long will I need to stay in hospital after the [[surgery]]?"
    extr: "Ameliyattan sonra hastanede ne kadar kalmam gerekecek?"
    d: 1
    col: ["have surgery", "minor surgery", "after surgery"]
    syn: ["operation"]
    fam: ["surgeon (i.) cerrah", "surgical (s.) cerrahi"]
    tone: ["Hastane"]
    dis:

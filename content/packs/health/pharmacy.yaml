grammar:
  - id: pharmacy-frequency
    title: "Sıklık ve süre: twice a day, every 8 hours, for a week"
    short: "İlaç talimatlarında sıklık “… a day / every … hours”, süre “for …”, zaman “before / after / with” ile söylenir."
    long: "Sıklık: once a day (günde bir), twice a day (günde iki), three times a day (günde üç), every eight hours (sekiz saatte bir). Süre: for five days (beş gün boyunca), until the pack is finished (kutu bitene kadar). Zaman: before meals (yemekten önce), after meals (yemekten sonra), with food (yemekle), at bedtime (yatarken). Soru: How often …? (ne sıklıkla), How long …? (ne kadar süre)."
    ex: ["Take one tablet every eight hours. | Sekiz saatte bir tablet alın.", "Use the drops three times a day for a week. | Damlaları bir hafta boyunca günde üç kez kullanın.", "How long should I take it for? | Ne kadar süre almalıyım?"]

  - id: if-clauses-instructions
    title: "Koşullu talimatlar: If you …, take / stop / see"
    short: "Prospektüslerde “If + şimdiki zaman, emir kipi” yapısı sık geçer: belirli bir durumda ne yapılacağını söyler."
    long: "Yapı: If + özne + şimdiki zaman, emir kipi. If you miss a dose, take it as soon as you remember. If you feel dizzy, do not drive. If symptoms persist, see a doctor. “if” cümlesinde will kullanılmaz: If you will feel … yanlıştır. Yerine “in case of + isim” de kullanılabilir: In case of overdose, contact a doctor."
    ex: ["If you feel dizzy, do not drive. | Başınız dönerse araç kullanmayın.", "If symptoms persist, see a doctor. | Belirtiler geçmezse doktora görünün.", "In case of an allergic reaction, stop taking it. | Alerjik reaksiyon durumunda kullanmayı bırakın."]

scenarios:
  - id: pharmacy-advice
    title: "Eczacıdan öneri isteme"
    sit: "Boğazın ağrıyor ve hafif ateşin var. Eczacıdan reçetesiz bir şey önermesini istiyorsun."
    d: 2
    targets: [painkiller, over-the-counter, drowsy, dosage]
    turns:
      - ["Pharmacist", "Hi, how can I help you today?", "Merhaba, bugün size nasıl yardımcı olabilirim?"]
      - choose:
          - ["I have a sore throat and a slight fever. Can you recommend something?", true, "Belirtiyi anlatıp kibarca öneri istiyor."]
          - ["I want medicine for throat.", false, "Fazla kısa ve kaba; belirti anlatılmamış."]
          - ["Give me antibiotic, please.", false, "Antibiyotik reçetesiz verilmez; belirtiyi anlatmak gerekir."]
      - ["Pharmacist", "These lozenges are available over the counter. Take one every three hours. Do you take any other medicine?", "Bu pastiller reçetesiz satılıyor. Üç saatte bir tane alın. Başka ilaç kullanıyor musunuz?"]
      - choose:
          - ["Yes, I take blood pressure pills. Is it safe to take them together?", true, "Kullandığı ilacı söyleyip etkileşimi soruyor."]
          - ["Yes, I take. Is safe?", false, "Nesne ve özne eksik; anlaşılmıyor."]
          - ["No problem, I take everything.", false, "Soruya cevap vermiyor ve güvenli değil."]
      - ["Pharmacist", "That's fine, there are no interactions. If symptoms persist for more than three days, please see a doctor.", "Sorun yok, etkileşimi yok. Belirtiler üç günden fazla sürerse lütfen doktora görünün."]

  - id: pick-up-prescription
    title: "Reçeteli ilacı almak"
    sit: "Doktorun yazdığı antibiyotiği almaya gittin. Penisiline alerjin var."
    d: 2
    targets: [allergic-reaction, finish-the-course, miss-a-dose]
    turns:
      - ["Pharmacist", "Here's your prescription. Do you have any allergies?", "İşte reçeteniz. Herhangi bir alerjiniz var mı?"]
      - choose:
          - ["Yes, I'm allergic to penicillin.", true, "Alerjiyi doğru kalıpla söylüyor."]
          - ["Yes, I have allergic penicillin.", false, "“allergic to” kalıbı bozuk."]
          - ["No, I like penicillin.", false, "Alerji sorusuna uygun değil."]
      - ["Pharmacist", "Good that you told me. This one isn't penicillin, so it's safe for you. Take it for seven days and finish the course.", "Söylemeniz iyi oldu. Bu penisilin değil, sizin için güvenli. Yedi gün kullanın ve kürü bitirin."]
      - choose:
          - ["What should I do if I miss a dose?", true, "Unutulan doz için doğru soru."]
          - ["What I do if I forget?", false, "Soru yapısı eksik: should + özne."]
          - ["Can I stop when I feel better?", false, "Eczacı kürü bitirmeyi söyledi; bu soru talimatla çelişiyor."]
      - ["Pharmacist", "Take it as soon as you remember, but never take a double dose.", "Hatırlar hatırlamaz alın ama asla çift doz almayın."]

readings:
  - id: medicine-label
    title: "Patient information leaflet"
    kind: "Prospektüs"
    d: 2
    s:
      - ["Read all of this leaflet carefully before you start taking this medicine.", "Bu ilacı almaya başlamadan önce bu prospektüsün tamamını dikkatle okuyun."]
      - ["Adults: take one or two tablets every four to six hours.", "Yetişkinler: dört ila altı saatte bir, bir veya iki tablet alın."]
      - ["Do not take more than eight tablets in 24 hours.", "24 saatte sekiz tabletten fazla almayın."]
      - ["This medicine may cause drowsiness. If affected, do not drive.", "Bu ilaç uyku hâli yapabilir. Etkilenirseniz araç kullanmayın."]
      - ["Store below 25°C and keep out of the reach of children.", "25°C'nin altında saklayın ve çocukların ulaşamayacağı yerde tutun."]
    gloss: ["leaflet | prospektüs, broşür", "drowsiness | uyku hâli", "if affected | etkilenirseniz", "out of the reach of | ulaşamayacağı yerde"]
    q:
      - q: "Bir yetişkin 24 saatte en fazla kaç tablet alabilir?"
        o: ["Dört", "Altı", "Sekiz"]
        a: 2
        why: "“Do not take more than eight tablets in 24 hours.”"
      - q: "İlaç uyku hâli yaparsa ne yapılmamalı?"
        o: ["Yemek yenmemeli", "Araç kullanılmamalı", "Su içilmemeli"]
        a: 1
        why: "“If affected, do not drive.”"

  - id: pharmacy-email
    title: "Your prescription is ready"
    kind: "Eczane bildirimi"
    d: 2
    s:
      - ["Your repeat prescription is ready to collect.", "Tekrarlanan reçeteniz hazır, alabilirsiniz."]
      - ["Please bring your ID when you come to the pharmacy.", "Eczaneye gelirken kimliğinizi getirin."]
      - ["One of your medicines is out of stock, so we have given you a generic version.", "İlaçlarınızdan biri stokta olmadığı için eşdeğerini verdik."]
      - ["It contains the same active ingredient and works in the same way.", "Aynı etken maddeyi içerir ve aynı şekilde etki eder."]
      - ["If you have any questions, our pharmacist can talk to you in private.", "Sorunuz varsa eczacımız sizinle özel olarak görüşebilir."]
    gloss: ["repeat prescription | tekrarlanan reçete", "collect | teslim almak", "active ingredient | etken madde", "in private | özel olarak, baş başa"]
    q:
      - q: "Eczaneye giderken ne götürülmeli?"
        o: ["Eski kutular", "Kimlik", "Doktor raporu"]
        a: 1
        why: "“Please bring your ID”"
      - q: "Neden eşdeğer ilaç verildi?"
        o: ["Daha ucuz olduğu için", "Orijinali stokta olmadığı için", "Doktor istediği için"]
        a: 1
        why: "“One of your medicines is out of stock”"

writing:
  id: ask-pharmacist
  p: "Eczacıya göndereceğin 3–4 cümlelik bir mesaj yaz: hangi ilacı kullanıyorsun, neyi merak ediyorsun (doz, yan etki, başka ilaçla birlikte kullanım) ve ne istiyorsun?"
  rubric: ["İlaç ve sorun açıkça belirtilmiş", "Kibar soru yapısı kullanılmış (Is it safe to …? / Could you …?)", "Sıklık veya süre doğru ifade edilmiş (twice a day, for a week)"]
  samples: ["Hello, I'm taking amoxicillin twice a day for a tooth infection. Is it safe to take it with ibuprofen for the pain? Could you also tell me if I should take it with food? Thank you."]
  d: 2

